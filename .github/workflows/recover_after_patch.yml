name: Relic Loop Recovery Dispatcher

on:
  push:
    paths:
      - sitecustomize.py

permissions:
  actions: write
  contents: read

jobs:
  dispatch-production:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production workflow with patched code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run daily_video.yml --repo "${{ github.repository }}" --ref main -f mode=full
