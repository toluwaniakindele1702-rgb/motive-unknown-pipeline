name: Relic Loop Hardening And Test

on:
  push:
    paths:
      - ".github/workflows/harden_and_test.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply direct reliability fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("pipeline.py")
          s = p.read_text(encoding="utf-8")

          # RETENTION FIX: the previous run had a valid ~1740-word script, then
          # retention rewrote selected scenes and shrank the whole script to 1575.
          # Retention is never allowed to reduce a script below the hard 1700-word
          # production minimum. If it does, restore the pre-retention draft and,
          # when necessary, run the existing length repair before validation.
          old = '''    repaired = json.loads(json.dumps(script, ensure_ascii=False))
    by_id = {int(scene.get("id", 0)): scene for scene in repaired.get("scenes", [])}
'''
          new = '''    original_word_count = _script_word_count(script)
    repaired = json.loads(json.dumps(script, ensure_ascii=False))
    by_id = {int(scene.get("id", 0)): scene for scene in repaired.get("scenes", [])}
'''
          if old in s and "original_word_count = _script_word_count(script)" not in s:
              s = s.replace(old, new, 1)

          old = '''        by_id[scene_id]["narration"] = text

    validate_script(repaired)
'''
          new = '''        by_id[scene_id]["narration"] = text

    repaired_word_count = _script_word_count(repaired)
    if repaired_word_count < SCRIPT_MIN_WORDS:
        print(
            f"[RETENTION] repair reduced script from ~{original_word_count} to "
            f"~{repaired_word_count} words; restoring the valid draft before validation."
        )
        repaired = json.loads(json.dumps(script, ensure_ascii=False))
        repaired_word_count = _script_word_count(repaired)
        if repaired_word_count < SCRIPT_MIN_WORDS:
            repaired = _repair_script_length(topic, research, plan, repaired)
            repaired_word_count = _script_word_count(repaired)
        if repaired_word_count < SCRIPT_MIN_WORDS:
            raise RuntimeError(
                f"Retention repair could not preserve the hard script minimum: "
                f"{repaired_word_count} < {SCRIPT_MIN_WORDS}."
            )

    validate_script(repaired)
'''
          if old not in s:
              raise SystemExit("retention validation anchor not found")
          if "repair reduced script from ~" not in s:
              s = s.replace(old, new, 1)

          # SOURCE-LEVEL script hardening: final repair must not accept the old
          # 1600-word tolerance. The production contract is exactly 1700-2600.
          old = '''    # A tiny final shortfall is acceptable when the per-scene narration is valid.
    # Do not throw away an otherwise production-ready episode because a fallback
    # model missed the target by a small amount.
    minimum_acceptable = max(1600, SCRIPT_MIN_WORDS - 150)
    if not (minimum_acceptable <= final_words <= SCRIPT_MAX_WORDS):
        raise RuntimeError(
            f"Script repair finished at {final_words} words; "
            f"expected at least {minimum_acceptable} and at most {SCRIPT_MAX_WORDS}."
        )
'''
          new = '''    # Hard production contract: never pass a script below 1700 words.
    if not (SCRIPT_MIN_WORDS <= final_words <= SCRIPT_MAX_WORDS):
        raise RuntimeError(
            f"Script repair finished at {final_words} words; "
            f"expected {SCRIPT_MIN_WORDS}-{SCRIPT_MAX_WORDS}."
        )
'''
          if old in s:
              s = s.replace(old, new, 1)

          # SOURCE-LEVEL SCENE-COUNT FIX: preliminary validation must allow an
          # under-segmented LLM draft to reach a dedicated re-segmentation pass.
          old = '''    scenes = script.get("scenes")
    if not isinstance(scenes, list) or not (SCENE_MIN <= len(scenes) <= SCENE_MAX):
        raise RuntimeError(f"Script scene count must be {SCENE_MIN}-{SCENE_MAX}; got {len(scenes) if isinstance(scenes, list) else 0}.")
'''
          new = '''    scenes = script.get("scenes")
    if not isinstance(scenes, list):
        raise RuntimeError("Script scenes must be a list.")
    if not allow_short and not (SCENE_MIN <= len(scenes) <= SCENE_MAX):
        raise RuntimeError(f"Script scene count must be {SCENE_MIN}-{SCENE_MAX}; got {len(scenes)}.")
    if allow_short and len(scenes) > SCENE_MAX:
        raise RuntimeError(f"Script scene count must not exceed {SCENE_MAX}; got {len(scenes)}.")
'''
          if old not in s:
              raise SystemExit("scene validation anchor not found")
          if "Script scenes must be a list." not in s:
              s = s.replace(old, new, 1)

          marker = '''def _repair_script_length(
'''
          if marker not in s:
              raise SystemExit("scene repair insertion marker not found")

          new_func = r'''def _repair_scene_count(
    topic: dict[str, Any],
    research: str,
    plan: dict[str, Any],
    script: dict[str, Any],
) -> dict[str, Any]:
    """Split an under-segmented script into the required number of useful scenes."""
    scenes = script.get("scenes") or []
    if len(scenes) >= SCENE_MIN:
        return script

    target = min(SCENE_MAX, max(SCENE_MIN, len(scenes) + 4))
    prompt = f"""
You are a production editor for Relic Loop.

The writer produced only {len(scenes)} scenes, but the renderer requires {SCENE_MIN}-{SCENE_MAX}.
Re-segment the EXISTING narration into exactly {target} distinct scenes.

Rules:
- Preserve every important factual claim and the story order.
- Do not invent facts, dialogue, motives, events, statistics, or sources.
- Do not delete meaningful narration.
- Split at natural visual/story transitions: new mechanism, example, comparison, consequence,
  evidence, reaction, reversal, or payoff.
- Keep each scene useful and visually concrete.
- You may lightly rewrite transitions so the split scenes read naturally.
- Keep the same title_question, era, and thumbnail.
- Return the complete script JSON, not a patch.

TOPIC:
{json.dumps(topic, ensure_ascii=False)}

STORY PLAN:
{json.dumps(plan, ensure_ascii=False)}

RESEARCH:
{research}

CURRENT SCRIPT:
{json.dumps(script, ensure_ascii=False)}

Return JSON only in this shape:
{{
  "title_question": "...",
  "era": "...",
  "scenes": [
    {{"id": 1, "narration": "...", "setting": "...", "characters": [], "action": "...", "props": [], "mood": "..."}}
  ],
  "thumbnail": {{"headline": "...", "subject": "...", "supporting_prop": "...", "emotion": "...", "composition": "...", "preferred_variant": 1}}
}}
""".strip()

    repaired = groq_json(
        GROQ_WRITER_MODEL,
        [{"role": "user", "content": prompt}],
        max_completion_tokens=7200,
        temperature=0.35,
        attempts=3,
    )
    validate_script(repaired, allow_short=True)
    if len(repaired.get("scenes", [])) < SCENE_MIN:
        raise RuntimeError(
            f"Scene-count repair returned {len(repaired.get('scenes', []))} scenes; need at least {SCENE_MIN}."
        )
    atomic_write_json(SCRIPT_PATH, repaired)
    _save_current_json(CURRENT_SCRIPT_PATH, repaired)
    print(f"[SCRIPT] scene-count repair: {len(scenes)} -> {len(repaired['scenes'])} scenes")
    return repaired


'''
          s = s.replace(marker, new_func + marker, 1)

          old = '''    validate_script(script, allow_short=True)
    atomic_write_json(SCRIPT_PATH, script)
    _save_current_json(CURRENT_SCRIPT_PATH, script)
    total_words = _script_word_count(script)
'''
          new = '''    validate_script(script, allow_short=True)
    if len(script.get("scenes", [])) < SCENE_MIN:
        print(
            f"[SCRIPT] scene-count repair needed: {len(script.get('scenes', []))} scenes; "
            f"minimum is {SCENE_MIN}."
        )
        script = _repair_scene_count(topic, research, plan, script)

    atomic_write_json(SCRIPT_PATH, script)
    _save_current_json(CURRENT_SCRIPT_PATH, script)
    total_words = _script_word_count(script)
'''
          if old not in s:
              raise SystemExit("write_script scene repair anchor not found")
          if "scene-count repair needed:" not in s:
              s = s.replace(old, new, 1)

          p.write_text(s, encoding="utf-8")
          print("DIRECT PIPELINE RETENTION + SCENE COUNT FIXES APPLIED")
          PY

      - name: Validate source
        run: python -m py_compile pipeline.py sitecustomize.py local_image_worker.py

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: repair under-segmented scripts before validation"
          git push
