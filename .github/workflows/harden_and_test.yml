name: Relic Loop Hardening And Test

on:
  push:
    paths:
      - ".github/workflows/harden_and_test.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply reliability patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('pipeline.py'); s=p.read_text(encoding='utf-8')
          anchor='CURRENT_SHORTS_PATH = CURRENT_RUN_DIR / "shorts.json"\n'
          block='''\nPROVIDER_HEALTH_PATH = STATE_DIR / "provider_health.json"\n\ndef _provider_health() -> dict[str, Any]:\n    data = load_json(PROVIDER_HEALTH_PATH, {})\n    return data if isinstance(data, dict) else {}\n\ndef _provider_blocked(provider: str) -> bool:\n    entry = _provider_health().get(provider)\n    if not isinstance(entry, dict): return False\n    until = str(entry.get("disabled_until", ""))\n    if not until: return False\n    try: return datetime.now(timezone.utc) < datetime.fromisoformat(until)\n    except ValueError: return False\n\ndef _block_provider(provider: str, reason: str) -> None:\n    from datetime import timedelta\n    now=datetime.now(timezone.utc); until=now.replace(hour=0,minute=0,second=0,microsecond=0)+timedelta(days=1)\n    data=_provider_health(); data[provider]={"disabled_until":until.isoformat(),"reason":str(reason)[:1200],"updated_at":now.isoformat()}\n    atomic_write_json(PROVIDER_HEALTH_PATH,data)\n    print(f"[PROVIDER HEALTH] {provider} disabled until {until.isoformat()}: {str(reason)[:300]}")\n\ndef _should_block_provider(provider: str, message: str) -> bool:\n    text=str(message).lower()\n    if provider=="cloudflare": return "daily free allocation" in text or "10,000 neurons" in text or "http 429" in text\n    if provider=="puter": return "insufficient credits" in text or "insufficient credit" in text\n    if provider in {"huggingface","replicate"}: return "not configured" in text\n    return False\n\n'''
          if 'PROVIDER_HEALTH_PATH = STATE_DIR / "provider_health.json"' not in s:\n              if anchor not in s: raise SystemExit('provider-health anchor missing')\n              s=s.replace(anchor,anchor+block,1)\n          old='''    for provider in IMAGE_PROVIDER_ORDER:\n        if provider in disabled:\n            continue\n        attempted='''\n          new='''    for provider in IMAGE_PROVIDER_ORDER:\n        if provider in disabled:\n            continue\n        if _provider_blocked(provider):\n            print(f"[IMAGE FALLBACK] skipping {provider}: persistent provider health block")\n            disabled.add(provider)\n            continue\n        attempted='''\n          if old in s: s=s.replace(old,new,1)\n          elif new not in s: raise SystemExit('provider-loop anchor missing')\n          pat=r'(except ImageProviderError as exc:\n\s+print\(f"\\[IMAGE FALLBACK\\] \{provider\} failed: \{exc\}"\)\n)'\n          rep=r'\\1            if _should_block_provider(provider, str(exc)):\n                _block_provider(provider, str(exc))\n'\n          if 'if _should_block_provider(provider, str(exc))' not in s:\n              s,n=re.subn(pat,rep,s,count=1)\n              if n!=1: raise SystemExit('provider-exception anchor missing')\n          p.write_text(s,encoding='utf-8')\n          sc=Path('sitecustomize.py'); t=sc.read_text(encoding='utf-8')\n          marker='if isinstance(response_format, dict) and response_format.get("type") == "json_schema":\n'\n          replacement='''if isinstance(response_format, dict) and response_format.get("type") == "json_schema":\n            json_schema = response_format.get("json_schema")\n            if isinstance(json_schema, dict) and json_schema.get("name") == "motive_unknown_seo":\n                fallback_kwargs = dict(kwargs)\n                fallback_kwargs["response_format"] = {"type": "json_object"}\n                print("[GROQ COMPAT] SEO schema forced to generic JSON for server compatibility.")\n                return _original_create(self, *args, **fallback_kwargs)\n'''
          if 'SEO schema forced to generic JSON' not in t:\n              if marker not in t: raise SystemExit('sitecustomize schema marker missing')\n              t=t.replace(marker,replacement,1)\n          sc.write_text(t,encoding='utf-8')\n          print('Reliability patches applied.')\n          PY

      - name: Validate source
        run: python -m py_compile pipeline.py sitecustomize.py local_image_worker.py

      - name: Commit patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline.py sitecustomize.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: harden image fallback and SEO recovery"
          git push

# retrigger reliability validation
