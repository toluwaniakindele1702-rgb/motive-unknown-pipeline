name: Relic Loop Hardening And Test

on:
  push:
    paths:
      - ".github/workflows/harden_and_test.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply direct pipeline topic-resume fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("pipeline.py")
          s = p.read_text(encoding="utf-8")

          old = '''    checkpoint("starting")
    history = load_history()

    # Reuse small text artifacts saved by a previous failed Actions run.
    topic = _load_current_json(CURRENT_TOPIC_PATH)
    topic_resumed = isinstance(topic, dict) and bool(topic.get("question"))
    if topic_resumed:
        print("[RESUME] Reusing saved topic.")
    else:
        topic = choose_topic(history)
        _save_current_json(CURRENT_TOPIC_PATH, topic)
    checkpoint("topic_complete", question=topic["question"], resumed=topic_resumed)
'''

          new = '''    checkpoint("starting")
    history = load_history()

    # NEVER resume a stale topic by default. A failed/cancelled run can leave
    # current-run artifacts behind, but the next production must choose a fresh
    # topic against the channel history. Explicit stage resume is opt-in only.
    allow_stage_resume = os.environ.get("RELIC_LOOP_RESUME", "0").strip().lower() in {"1", "true", "yes"}
    if not allow_stage_resume:
        for stale_path in (
            CURRENT_TOPIC_PATH,
            CURRENT_RESEARCH_PATH,
            CURRENT_STORY_PATH,
            CURRENT_SCRIPT_PATH,
            CURRENT_SEO_PATH,
            CURRENT_UPLOAD_PATH,
            CURRENT_SHORTS_PATH,
        ):
            try:
                stale_path.unlink(missing_ok=True)
            except OSError as exc:
                print(f"[STATE] Could not clear stale run artifact {stale_path}: {exc}")

    topic = choose_topic(history)
    _save_current_json(CURRENT_TOPIC_PATH, topic)
    print(f"[TOPIC] Fresh topic selected: {topic['question']}")
    checkpoint("topic_complete", question=topic["question"], resumed=False)
'''
          if old not in s:
              raise SystemExit("topic resume block not found")
          s = s.replace(old, new, 1)

          old = '''    research = _load_current_text(CURRENT_RESEARCH_PATH)
    research_resumed = bool(research)
    if research_resumed:
        print("[RESUME] Reusing saved research.")
    else:
        research = research_topic(topic)
        _save_current_text(CURRENT_RESEARCH_PATH, research)
'''
          new = '''    research = _load_current_text(CURRENT_RESEARCH_PATH) if allow_stage_resume else None
    research_resumed = bool(research) if allow_stage_resume else False
    if research_resumed:
        print("[RESUME] Reusing saved research for explicit stage resume.")
    else:
        research = research_topic(topic)
        _save_current_text(CURRENT_RESEARCH_PATH, research)
'''
          if old not in s:
              raise SystemExit("research resume block not found")
          s = s.replace(old, new, 1)

          old = '''    story = _load_current_json(CURRENT_STORY_PATH)
    story_resumed = isinstance(story, dict) and bool(story.get("story_arc"))
'''
          new = '''    story = _load_current_json(CURRENT_STORY_PATH) if allow_stage_resume else None
    story_resumed = isinstance(story, dict) and bool(story.get("story_arc")) if allow_stage_resume else False
'''
          if old not in s:
              raise SystemExit("story resume block not found")
          s = s.replace(old, new, 1)

          old = '''    script = _load_current_json(CURRENT_SCRIPT_PATH)
    if isinstance(script, dict):
'''
          new = '''    script = _load_current_json(CURRENT_SCRIPT_PATH) if allow_stage_resume else None
    if allow_stage_resume and isinstance(script, dict):
'''
          if old not in s:
              raise SystemExit("script resume block not found")
          s = s.replace(old, new, 1)

          old = '''    seo = _load_current_json(CURRENT_SEO_PATH)
    seo_resumed = isinstance(seo, dict) and bool(seo.get("title") and seo.get("description") and seo.get("tags"))
'''
          new = '''    seo = _load_current_json(CURRENT_SEO_PATH) if allow_stage_resume else None
    seo_resumed = isinstance(seo, dict) and bool(seo.get("title") and seo.get("description") and seo.get("tags")) if allow_stage_resume else False
'''
          if old not in s:
              raise SystemExit("SEO resume block not found")
          s = s.replace(old, new, 1)

          p.write_text(s, encoding="utf-8")
          print("DIRECT PIPELINE TOPIC RESUME FIX APPLIED")
          PY

      - name: Validate pipeline
        run: python -m py_compile pipeline.py

      - name: Commit direct source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: never resume stale topic state by default"
          git push
