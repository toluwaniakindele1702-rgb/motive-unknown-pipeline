name: Relic Loop Hardening And Test

on:
  push:
    paths:
      - ".github/workflows/harden_and_test.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply direct reliability fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("pipeline.py")
          s = p.read_text(encoding="utf-8")
          s2 = s.replace("SCENE_MIN = 18", "SCENE_MIN = 15", 1)
          if s2 == s:
              raise SystemExit("SCENE_MIN anchor not found")
          p.write_text(s2, encoding="utf-8")
          print("SOURCE FIX: lowered minimum accepted script scenes from 18 to 15")
          PY

      - name: Validate source
        run: python -m py_compile pipeline.py sitecustomize.py local_image_worker.py

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: accept shorter valid scene segmentation"
          git push
