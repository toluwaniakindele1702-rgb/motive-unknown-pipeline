name: Run Relic Loop Hardening Script

on:
  push:
    paths:
      - "harden_pipeline.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply hardening
        run: python harden_pipeline.py

      - name: Validate
        run: python -m py_compile pipeline.py local_image_worker.py

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline.py local_image_worker.py .github/workflows/daily_video.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: harden provider fallback and restore local image generation"
          git push
