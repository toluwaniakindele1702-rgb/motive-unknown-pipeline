name: Relic Loop story and pipeline validation
on:
  push:
    branches: [feature/relic-loop-new-pipeline]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install 'groq>=0.31,<1' 'requests>=2.32,<3' 'Pillow>=11,<13' 'edge-tts>=7,<8'
      - run: python -m unittest test_story_quality_gate test_creative_ai test_quality_ai
      - run: python -m py_compile story_quality_gate.py creative_ai.py quality_ai.py relic_loop_video.py relic_loop_youtube_publish.py
