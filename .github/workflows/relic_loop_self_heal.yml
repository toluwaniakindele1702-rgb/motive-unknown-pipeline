name: Relic Loop Self-Healing Agent
run-name: "Repair analysis for production run ${{ github.event.workflow_run.run_number }}"

on:
  workflow_run:
    workflows: ["Chispa-Pifia V2 Production"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: relic-loop-repair-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  diagnose-and-propose:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact failed commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install repair-agent client
        run: python -m pip install --disable-pip-version-check 'groq>=0.31,<1'

      - name: Diagnose failure and validate proposed patch
        id: repair
        env:
          GH_TOKEN: ${{ github.token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TARGET_RUN_ID: ${{ github.event.workflow_run.id }}
          REPAIR_MODEL: openai/gpt-oss-120b
        run: python .github/scripts/relic_loop_self_heal.py

      - name: Create isolated repair branch and commit
        if: steps.repair.outputs.patch_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          BRANCH="auto-repair/run-${SOURCE_RUN}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add $(echo "${{ steps.repair.outputs.changed_files }}" | tr ',' ' ')
          git commit -m "Propose validated Relic Loop repair for run ${SOURCE_RUN}"
          git push origin "$BRANCH"
          gh pr create --repo "$GH_REPOSITORY" --base main --head "$BRANCH" \
            --title "Automated Relic Loop repair for production run ${SOURCE_RUN}" \
            --body "## Automated failure diagnosis\n\nThis PR was generated after production run [${SOURCE_RUN}](${{ github.event.workflow_run.html_url }}) failed.\n\nThe proposed change passed Python syntax checks and applicable deterministic self-tests. It has **not** been automatically merged or published. Review the diff and run a full validation before merging.\n\nThe repair agent is restricted to allowlisted application Python files; workflow/security/publishing configuration is not editable."

      - name: Preserve diagnosis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relic-loop-repair-report-${{ github.event.workflow_run.run_number }}
          path: |
            repair_report.json
            repair_summary.md
            validated_repair.diff
          if-no-files-found: ignore
          retention-days: 30
