name: Publish Run 40 to Chispa-Pifia
run-name: "Publish Run 40 publicly to YouTube"

on:
  push:
    branches: [main]
    paths:
      - ".github/triggers/publish-run40.txt"

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout uploader
        uses: actions/checkout@v5

      - name: Install FFmpeg tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v ffprobe
          ffprobe -version | head -n 1

      - name: Download Run 40 artifact
        uses: actions/download-artifact@v4
        with:
          name: chispa-pifia-v2-40
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: "42567755891"

      - name: Prepare and validate video
        run: |
          set -euo pipefail
          mkdir -p state/current_run
          video="$(find artifact -type f -name 'relic_loop_short.mp4' -print -quit)"
          test -n "$video" || { echo "::error::Run 40 MP4 missing"; exit 1; }
          cp "$video" state/current_run/relic_loop_short.mp4
          for f in relic_loop_short.json flow_manifest.json; do
            src="$(find artifact -type f -name "$f" -print -quit || true)"
            if [ -n "$src" ]; then cp "$src" "state/current_run/$f"; fi
          done
          duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 state/current_run/relic_loop_short.mp4)"
          python - "$duration" <<'PY'
          import sys
          d=float(sys.argv[1])
          print(f"Run 40 duration: {d:.2f}s")
          if not 50 <= d <= 90:
              raise SystemExit(f"Duration outside 50–90 seconds: {d:.2f}s")
          PY

      - name: Upload publicly to YouTube
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_PRIVACY_STATUS: public
          CHANNEL_NAME: Chispa-Pifia
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_TOKEN_JSON" || { echo "::error::YOUTUBE_TOKEN_JSON is missing"; exit 1; }
          test -n "$YOUTUBE_CLIENT_SECRET_JSON" || { echo "::error::YOUTUBE_CLIENT_SECRET_JSON is missing"; exit 1; }
          python -m pip install --upgrade pip
          python -m pip install 'google-api-python-client>=2.180,<3' 'google-auth>=2.40,<3' 'google-auth-httplib2>=0.2,<1'
          python youtube_upload.py

      - name: Save YouTube upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chispa-pifia-run40-youtube-receipt
          path: state/current_run/youtube_upload.json
          if-no-files-found: ignore
          retention-days: 30
