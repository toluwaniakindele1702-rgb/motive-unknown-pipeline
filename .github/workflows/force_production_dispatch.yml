name: Relic Loop Production Trigger

on:
  push:
    paths:
      - '.github/force_production_run'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Shorts-first Relic Loop workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run daily_video.yml --repo "${{ github.repository }}" --ref main -f mode=shorts_flow
          echo "Dispatched Relic Loop Daily Video in Shorts-first Flow handoff mode."
