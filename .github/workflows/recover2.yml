name: Relic Loop Recovery Rerun

on:
  push:
    paths:
      - .github/workflows/recover2.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch-production:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch patched production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run daily_video.yml --repo "${{ github.repository }}" --ref main -f mode=full
