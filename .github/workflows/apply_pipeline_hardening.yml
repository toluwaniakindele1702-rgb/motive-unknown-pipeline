name: Apply Relic Loop Pipeline Hardening

on:
  push:
    paths:
      - ".github/workflows/apply_pipeline_hardening.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch pipeline and production workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pipeline = Path("pipeline.py")
          text = pipeline.read_text(encoding="utf-8")

          # Persist provider failures across runs so a known-exhausted provider
          # cannot waste another full run before falling back to local generation.
          anchor = 'CURRENT_SHORTS_PATH = CURRENT_RUN_DIR / "shorts.json"\n'
          insertion = r'''
PROVIDER_HEALTH_PATH = STATE_DIR / "provider_health.json"


def _provider_health() -> dict[str, Any]:
    data = load_json(PROVIDER_HEALTH_PATH, {})
    return data if isinstance(data, dict) else {}


def _provider_is_blocked(provider: str) -> bool:
    entry = _provider_health().get(provider)
    if not isinstance(entry, dict):
        return False
    until = str(entry.get("disabled_until", ""))
    if not until:
        return False
    try:
        return datetime.now(timezone.utc) < datetime.fromisoformat(until)
    except ValueError:
        return False


def _block_provider(provider: str, reason: str, *, until: datetime | None = None) -> None:
    if until is None:
        until = datetime.now(timezone.utc).replace(hour=0, minute=0, second=0, microsecond=0)
        from datetime import timedelta
        until = until + timedelta(days=1)
    data = _provider_health()
    data[provider] = {
        "disabled_until": until.isoformat(),
        "reason": str(reason)[:1800],
        "updated_at": datetime.now(timezone.utc).isoformat(),
    }
    atomic_write_json(PROVIDER_HEALTH_PATH, data)
    print(f"[PROVIDER HEALTH] {provider} blocked until {until.isoformat()}: {str(reason)[:500]}")


def _provider_failure_should_persist(provider: str, message: str) -> bool:
    lower = str(message).lower()
    if provider == "cloudflare":
        return "429" in lower or "daily free allocation" in lower or "10,000 neurons" in lower
    if provider == "puter":
        return "insufficient" in lower and "credit" in lower
    if provider == "huggingface":
        return "token is not configured" in lower or "not configured" in lower
    if provider == "replicate":
        return "token is not configured" in lower or "not configured" in lower
    return False
'''
          if anchor not in text:
              raise SystemExit("pipeline anchor for provider health was not found")
          if "PROVIDER_HEALTH_PATH = STATE_DIR / \"provider_health.json\"" not in text:
              text = text.replace(anchor, anchor + insertion + "\n", 1)

          old_loop = '''    for provider in IMAGE_PROVIDER_ORDER:\n        if provider in disabled:\n            continue\n        attempted.append(provider)'''
          new_loop = '''    for provider in IMAGE_PROVIDER_ORDER:\n        if provider in disabled:\n            continue\n        if _provider_is_blocked(provider):\n            print(f"[IMAGE FALLBACK] skipping {provider}: provider health marked unavailable")\n            disabled.add(provider)\n            continue\n        attempted.append(provider)'''
          if old_loop in text:
              text = text.replace(old_loop, new_loop, 1)
          elif new_loop not in text:
              raise SystemExit("image provider loop anchor was not found")

          old_except = '''        except ImageProviderError as exc:\n            print(f"[IMAGE FALLBACK] {provider} failed: {exc}")\n            if exc.disable_for_run:\n                disabled.add(provider)\n                setattr(_generate_image_with_fallback, "_disabled", disabled)\n                print(f"[IMAGE FALLBACK] disabling {provider} for the rest of this run.")'''
          new_except = '''        except ImageProviderError as exc:\n            print(f"[IMAGE FALLBACK] {provider} failed: {exc}")\n            if _provider_failure_should_persist(provider, str(exc)):\n                _block_provider(provider, str(exc))\n            if exc.disable_for_run:\n                disabled.add(provider)\n                setattr(_generate_image_with_fallback, "_disabled", disabled)\n                print(f"[IMAGE FALLBACK] disabling {provider} for the rest of this run.")'''
          if old_except in text:
              text = text.replace(old_except, new_except, 1)
          elif new_except not in text:
              raise SystemExit("image provider exception anchor was not found")

          # Make the local worker substantially more disciplined: the prompt must
          # describe the narrated beat, not invent people, scenes, or decorative filler.
          old_compact_doc = '    """Keep the narration subject dominant; LCM does not benefit from negative prompts."""'
          new_compact_doc = '    """Keep the narrated subject dominant and suppress irrelevant or malformed visual content."""'
          if old_compact_doc in text:
              text = text.replace(old_compact_doc, new_compact_doc, 1)

          old_call = '''    result = PIPELINE(\n        compact,\n        num_inference_steps=steps,\n        guidance_scale=8.0,\n        lcm_origin_steps=50,\n        width=width,\n        height=height,\n        generator=generator,\n    )'''
          new_call = '''    negative_prompt = (\n        "text, letters, words, captions, subtitles, logos, watermark, fake writing, "\n        "random signage, UI screenshot, poster, collage, split screen, duplicate objects, "\n        "extra limbs, malformed hands, distorted face, deformed body, sexualized pose, "\n        "revealing clothing, unrelated person, unrelated animal, gore, blood, injury, "\n        "violence, horror, photorealistic stock photo, vintage 1960s textbook art, "\n        "sepia, muddy composition, blurry, low detail, clutter, decorative filler"\n    )\n    result = PIPELINE(\n        compact,\n        negative_prompt=negative_prompt,\n        num_inference_steps=steps,\n        guidance_scale=8.0,\n        lcm_origin_steps=50,\n        width=width,\n        height=height,\n        generator=generator,\n    )'''
          if old_call in text:
              text = text.replace(old_call, new_call, 1)
          elif 'negative_prompt = (' not in text:
              raise SystemExit("local worker call anchor was not found in pipeline.py")

          pipeline.write_text(text, encoding="utf-8")

          worker = Path("local_image_worker.py")
          w = worker.read_text(encoding="utf-8")
          old = '''        candidate_parts.append(field)\n\n    candidate = " ".join(candidate_parts)'''
          new = '''        candidate_parts.append(field)\n\n    # Never allow the local model to replace the narrated idea with a generic\n    # character portrait. The narration fact and visible action always win.\n    if beat:\n        candidate = "NARRATED FACT: " + trim_words(beat, 38) + ". " + " ".join(candidate_parts)\n    else:\n        candidate = " ".join(candidate_parts)'''
          if old in w:
              w = w.replace(old, new, 1)
          worker.write_text(w, encoding="utf-8")

          workflow = Path(".github/workflows/daily_video.yml")
          y = workflow.read_text(encoding="utf-8")
          y = y.replace(
              "# Cloudflare is the primary image provider. Puter/Hugging Face/Replicate are fallbacks.\n      # Local DreamShaper is intentionally excluded from production because its visual relevance has been unreliable.\n      IMAGE_PROVIDERS: 'cloudflare,puter,huggingface,replicate'",
              "# Cloudflare is primary. Puter/Hugging Face/Replicate are secondary; local OpenVINO is the final emergency fallback.\n      # Provider health is persisted so an exhausted provider is skipped until its cooldown expires.\n      IMAGE_PROVIDERS: 'cloudflare,puter,huggingface,replicate,local'",
              1,
          )
          y = y.replace(
              "            run_work/output/short_*.srt\n            state/current_run/shorts.json",
              "            run_work/output/short_*.srt\n            run_work/output/*.mp4\n            state/current_run/shorts.json\n            state/provider_health.json",
              1,
          )
          workflow.write_text(y, encoding="utf-8")
          print("Pipeline hardening patch prepared.")
          PY

      - name: Validate patched source
        shell: bash
        run: |
          python -m py_compile pipeline.py local_image_worker.py
          grep -n "IMAGE_PROVIDERS" .github/workflows/daily_video.yml
          grep -n "PROVIDER_HEALTH_PATH" pipeline.py
          grep -n "negative_prompt" local_image_worker.py pipeline.py

      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline.py local_image_worker.py .github/workflows/daily_video.yml
          if git diff --cached --quiet; then
            echo "No hardening changes were needed."
            exit 0
          fi
          git commit -m "fix: harden provider fallback and restore local image generation"
          git push
