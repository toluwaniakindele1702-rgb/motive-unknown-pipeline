name: Apply final retention guard correction

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Correct below-minimum retention handling
        shell: python
        run: |
          from pathlib import Path
          p = Path('pipeline.py')
          s = p.read_text(encoding='utf-8')
          old = '''        if repaired_words < SCRIPT_MIN_WORDS:\n            print(\n                f"[RETENTION] repair reduced script to {repaired_words} words; "\n                f"restoring original ({original_words} words)."\n            )\n            script = original_script\n            if original_words < SCRIPT_MIN_WORDS:\n                script = _repair_script_length(topic, research, plan, script)\n        else:\n            script = repaired_script\n'''
          new = '''        if repaired_words < SCRIPT_MIN_WORDS:\n            print(\n                f"[RETENTION] repair reduced script to {repaired_words} words; "\n                "expanding the repaired script back to the hard minimum."\n            )\n            script = _repair_script_length(topic, research, plan, repaired_script)\n            if _script_word_count(script) < SCRIPT_MIN_WORDS:\n                print(\n                    f"[RETENTION] repaired script still below minimum; "\n                    f"restoring original ({original_words} words)."\n                )\n                script = original_script\n                if original_words < SCRIPT_MIN_WORDS:\n                    script = _repair_script_length(topic, research, plan, script)\n        else:\n            script = repaired_script\n'''
          if old not in s:
              raise SystemExit('Expected retention minimum block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Verify source
        run: python -m py_compile pipeline.py
      - name: Commit source correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline.py
          git commit -m "fix: preserve retention repair while restoring word minimum"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
