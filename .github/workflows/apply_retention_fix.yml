name: Apply retention minimum fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Patch retention minimum guard
        shell: python
        run: |
          from pathlib import Path
          p = Path('pipeline.py')
          s = p.read_text(encoding='utf-8')

          old = '''    retention_issues = _retention_quality_issues(script, topic)\n    if retention_issues:\n        print(f"[RETENTION] repair pass needed: {retention_issues}")\n        script = _repair_retention_structure(topic, research, plan, script, retention_issues)\n        validate_script(script)\n        retention_issues = _retention_quality_issues(script, topic)\n        if retention_issues:\n            raise RuntimeError(\n                "Retention gate failed after repair: " + "; ".join(retention_issues)\n            )\n'''

          new = '''    retention_issues = _retention_quality_issues(script, topic)\n    if retention_issues:\n        print(f"[RETENTION] repair pass needed: {retention_issues}")\n        original_script = json.loads(json.dumps(script, ensure_ascii=False))\n        original_words = _script_word_count(original_script)\n        repaired_script = _repair_retention_structure(\n            topic, research, plan, original_script, retention_issues\n        )\n        repaired_words = _script_word_count(repaired_script)\n\n        # Retention editing must never make an otherwise valid script fail the\n        # hard 1700-word minimum. If it shrinks the script, restore the\n        # original and only use length repair when the original was already short.\n        if repaired_words < SCRIPT_MIN_WORDS:\n            print(\n                f"[RETENTION] repair reduced script to {repaired_words} words; "\n                f"restoring original ({original_words} words)."\n            )\n            script = original_script\n            if original_words < SCRIPT_MIN_WORDS:\n                script = _repair_script_length(topic, research, plan, script)\n        else:\n            script = repaired_script\n\n        validate_script(script)\n        retention_issues = _retention_quality_issues(script, topic)\n        if retention_issues:\n            raise RuntimeError(\n                "Retention gate failed after repair: " + "; ".join(retention_issues)\n            )\n'''

          if old not in s:
              raise SystemExit('Expected retention block not found')
          s = s.replace(old, new, 1)

          old2 = '    validate_script(repaired)\n    atomic_write_json(SCRIPT_PATH, repaired)\n'
          new2 = '    # Scene-level validation only here; the caller enforces the strict total-word minimum.\n    validate_script(repaired, allow_short=True)\n    atomic_write_json(SCRIPT_PATH, repaired)\n'
          if old2 not in s:
              raise SystemExit('Expected retention repair validation line not found')
          s = s.replace(old2, new2, 1)

          p.write_text(s, encoding='utf-8')

      - name: Verify source
        run: python -m py_compile pipeline.py

      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: prevent retention repair from shrinking valid scripts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
