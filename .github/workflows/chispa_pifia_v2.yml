name: Chispa-Pifia V2 Production
run-name: "Chispa-Pifia V2 ${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional story seed; leave blank for an original story"
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/chispa_pifia_v2.yml"
      - "chispa_pifia_v2.py"
      - "chispa_pifia_contact_sheet.py"
      - "cloudflare_relic_loop_images.py"
      - "cloudflare_relic_loop_images_peanut.py"
      - "assemble_relic_loop_short.py"
      - "youtube_upload.py"

concurrency:
  group: chispa-pifia-v2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_WRITER_MODEL: openai/gpt-oss-120b
      GROQ_REVIEWER_MODEL: openai/gpt-oss-20b
      RELIC_LOOP_TOPIC: ${{ inputs.topic || vars.RELIC_LOOP_TOPIC || '' }}
      OVH_AI_ENDPOINTS_ACCESS_TOKEN: ${{ secrets.OVH_AI_ENDPOINTS_ACCESS_TOKEN }}
      OVH_IMAGE_MODEL: stable-diffusion-xl-base-v10
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_IMAGE_MODEL: "@cf/black-forest-labs/flux-2-klein-4b"
      RELIC_LOOP_IMAGE_WIDTH: "576"
      RELIC_LOOP_IMAGE_HEIGHT: "1024"
      RELIC_LOOP_IMAGE_RETRIES: "3"
      RELIC_LOOP_OCR_RETRIES: "2"
      RELIC_LOOP_OCR_STRICT: "1"
      RELIC_LOOP_TTS_VOICE: en-US-GuyNeural
      CHANNEL_NAME: Chispa-Pifia
      YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'public' }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install only V2 production dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --retries 5 --timeout 120 --prefer-binary \
            'groq>=0.31,<1.0' 'requests>=2.32,<3' 'Pillow>=10,<13' 'edge-tts>=7.0,<8' \
            'google-api-python-client>=2.180,<3' 'google-auth>=2.40,<3' \
            'google-auth-httplib2>=0.2,<1' 'google-auth-oauthlib>=1.2,<2'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr

      - name: Verify configuration, references and media tools
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GROQ_API_KEY" || { echo "::error::GROQ_API_KEY is missing"; exit 1; }
          test -n "$OVH_AI_ENDPOINTS_ACCESS_TOKEN" || { echo "::error::OVH_AI_ENDPOINTS_ACCESS_TOKEN is missing"; exit 1; }
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "Cloudflare fallback credentials are configured."
          else
            echo "::warning::Cloudflare fallback is unavailable; OVHcloud is the only image provider."
          fi
          test -n "$YOUTUBE_TOKEN_JSON" || { echo "::error::YOUTUBE_TOKEN_JSON is missing"; exit 1; }
          test -n "$YOUTUBE_CLIENT_SECRET_JSON" || { echo "::error::YOUTUBE_CLIENT_SECRET_JSON is missing"; exit 1; }
          for f in \
            assets/visual_references/Generate_modern_stickman_character_20261027121745.jpg \
            assets/visual_references/Remove_bag_and_animate_image_20261027125028.jpg; do
            test -s "$f" || { echo "::error::Missing approved reference: $f"; exit 1; }
          done
          ffmpeg -version | sed -n '1p'
          ffprobe -version | sed -n '1p'
          tesseract --version | sed -n '1p'
          tesseract --list-langs | grep -qx eng || { echo "::error::Tesseract English language data is missing"; exit 1; }
          python -c "import groq, requests, edge_tts; from PIL import Image; from googleapiclient.discovery import build; from google.oauth2.credentials import Credentials; print('Production imports passed')"
          echo "Image route: authenticated OVHcloud SDXL primary; Cloudflare FLUX.2 Klein fallback when configured."

      - name: Verify YouTube channel access before image generation
        run: python youtube_upload.py --check-auth

      - name: Run deterministic V2 tests
        run: |
          set -euo pipefail
          python -m py_compile chispa_pifia_v2.py chispa_pifia_contact_sheet.py \
            cloudflare_relic_loop_images.py cloudflare_relic_loop_images_peanut.py \
            assemble_relic_loop_short.py youtube_upload.py
          python chispa_pifia_v2.py --self-test

      - name: Write story and deterministic storyboard
        run: |
          set -o pipefail
          python chispa_pifia_v2.py 2>&1 | tee v2_story.log

      - name: Render images (OVHcloud SDXL primary; Cloudflare fallback)
        run: |
          set -o pipefail
          python cloudflare_relic_loop_images_peanut.py 2>&1 | tee v2_images.log

      - name: Create visual contact sheet
        run: python chispa_pifia_contact_sheet.py

      - name: Assemble narrated 9:16 Short
        run: |
          set -o pipefail
          python assemble_relic_loop_short.py 2>&1 | tee v2_assembly.log

      - name: Upload completed Short to Chispa-Pifia
        if: success()
        run: |
          set -o pipefail
          python youtube_upload.py 2>&1 | tee v2_youtube.log

      - name: Write production report
        if: always()
        shell: bash
        run: |
          {
            echo "# Chispa-Pifia V2 production report"
            echo "- Run: ${GITHUB_RUN_NUMBER}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Trigger: ${GITHUB_EVENT_NAME}"
            for f in v2_story.log v2_images.log v2_assembly.log v2_youtube.log; do
              if [ -f "$f" ]; then
                echo "## $f"
                tail -n 100 "$f"
              fi
            done
            if [ -f state/current_run/cloudflare_image_manifest.json ]; then
              echo "## Image provider report"
              python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("state/current_run/cloudflare_image_manifest.json").read_text())
          print(json.dumps({
              "provider_priority": d.get("provider_priority"),
              "provider_counts": d.get("provider_counts"),
              "provider_events": d.get("provider_events"),
              "reference_mode": d.get("reference_mode"),
              "rendered_images": len(d.get("beats", []))
          }, indent=2))
          PY
            fi
            if [ -f state/current_run/youtube_upload.json ]; then
              cat state/current_run/youtube_upload.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload video, contact sheet and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chispa-pifia-v2-${{ github.run_number }}
          path: |
            state/current_run/relic_loop_short.json
            state/current_run/flow_manifest.json
            state/current_run/cloudflare_image_manifest.json
            state/current_run/timing_manifest.json
            state/current_run/relic_loop_short.mp4
            state/current_run/contact_sheet.jpg
            state/current_run/youtube_upload.json
            v2_story.log
            v2_images.log
            v2_assembly.log
            v2_youtube.log
          if-no-files-found: warn
          retention-days: 14
