name: Quality AI isolated validation

on:
  push:
    branches: [feature/relic-loop-quality-ai]
    paths:
      - "quality_ai.py"
      - "quality_ai_media.py"
      - "test_quality_ai.py"
      - "test_quality_ai_media.py"
      - "QUALITY_AI_README.md"
      - ".github/workflows/quality-ai-validation.yml"
  pull_request:
    paths:
      - "quality_ai.py"
      - "quality_ai_media.py"
      - "test_quality_ai.py"
      - "test_quality_ai_media.py"
      - ".github/workflows/quality-ai-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-ai-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Quality AI development branch
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install isolated test dependencies
        run: python -m pip install --upgrade pip google-genai groq
      - name: Compile Quality AI
        run: python -m py_compile quality_ai.py quality_ai_media.py
      - name: Run offline unit and governance tests
        run: python -m unittest -v test_quality_ai.py test_quality_ai_media.py
      - name: Verify no publishing or production-gate integration
        run: |
          python - <<'PY'
          from pathlib import Path
          source = "\\n".join(Path(name).read_text().lower() for name in ("quality_ai.py", "quality_ai_media.py"))
          forbidden = ("youtube_upload", "workflow_dispatch", "workflow_run", "requests.post")
          assert not any(term in source for term in forbidden)
          for field in ('"may_block_production": false', '"may_cancel_or_pause_run": false', '"may_authorize_or_trigger_upload": false'):
              assert field in source
          print("Quality AI governance boundary verified.")
          PY
