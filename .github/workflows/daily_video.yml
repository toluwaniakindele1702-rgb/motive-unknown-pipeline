# Drop this into your existing workflow (e.g. .github/workflows/pipeline.yml).
# It runs a SearXNG container as a "service" alongside your job, reachable at
# http://localhost:8888 from the job's steps — no API key, no rate limit,
# no monthly fee, since it's your own container for the life of the run.
#
# IMPORTANT: SearXNG ships with JSON output DISABLED by default (it's meant
# to be a human-facing search UI). You must mount a settings.yml that turns
# it on, or search_tool's `format=json` request will get an HTML page back
# and fail to parse. Minimal settings.yml you need in your repo:
#
#   search:
#     formats:
#       - html
#       - json
#
# Save that as searxng-settings.yml in your repo root (or wherever you like)
# and point the volume mount below at it.

name: Motive Unknown Pipeline

on:
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    services:
      searxng:
        image: searxng/searxng:latest
        ports:
          - 8888:8080
        options: >-
          --health-cmd "wget -q -O- http://localhost:8080/healthz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6

    # was 3-space indented before (mismatched with services:/runs-on: above) —
    # that's invalid YAML and would fail to parse before the job ever ran.
    env:
      SEARXNG_URL: http://localhost:8888
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}

    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Mount SearXNG settings with JSON output enabled
        run: |
          docker cp searxng-settings.yml \
            $(docker ps --filter "ancestor=searxng/searxng:latest" -q):/etc/searxng/settings.yml
          docker restart $(docker ps --filter "ancestor=searxng/searxng:latest" -q)
          sleep 5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # This step got dropped somewhere along the way — it's what fixed your
      # very first "ffmpeg: command not found" failure. Without it, that
      # exact error comes right back.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run pipeline
        run: python pipeline.py

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-debug-output
          path: |
            *.mp3
            *.mp4
            *.png
            *.json
          retention-days: 3
