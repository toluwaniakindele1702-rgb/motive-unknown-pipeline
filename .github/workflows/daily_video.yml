name: Daily Motive Unknown Video

on:
  schedule:
    # Runs at 15:00 UTC every day = 4pm Nigeria time (WAT, UTC+1)
    # Change the hour below if you want a different time — GitHub always uses UTC.
    - cron: "0 15 * * *"
  workflow_dispatch: {}   # lets you also click "Run workflow" manually on GitHub anytime

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system fonts (needed for captions)
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run the pipeline
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: python pipeline.py

      - name: Upload video as a backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-output
          path: |
            shorts_video.mp4
            shorts_voiceover.mp3
            longform_voiceover.mp3
          retention-days: 7
