name: Motive Unknown Daily Video

on:
  schedule:
    - cron: '17 2 * * *'
      timezone: 'Africa/Lagos'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose a test or production run'
        required: true
        default: full
        type: choice
        options:
          - full
          - voice_test
          - visual_test
          - local_image_test

concurrency:
  group: motive-unknown-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
      YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'private' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      IMAGE_PROVIDERS: ${{ vars.IMAGE_PROVIDERS || 'cloudflare,huggingface,replicate,local' }}
      KOKORO_VOICE: ${{ vars.KOKORO_VOICE || 'am_onyx' }}
      KOKORO_SPEED: ${{ vars.KOKORO_SPEED || '1.04' }}
      CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'Motive Unknown' }}
      MAX_VISUAL_BEATS_PER_VIDEO: ${{ vars.MAX_VISUAL_BEATS_PER_VIDEO || '64' }}
      VISUAL_BEAT_TARGET_WORDS: ${{ vars.VISUAL_BEAT_TARGET_WORDS || '30' }}
      BACKGROUND_MUSIC_VOLUME: ${{ vars.BACKGROUND_MUSIC_VOLUME || '0.055' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set run mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "PIPELINE_MODE=${{ inputs.mode }}" >> "$GITHUB_ENV"
          else
            echo "PIPELINE_MODE=full" >> "$GITHUB_ENV"
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Cache Hugging Face / Kokoro model
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: kokoro-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            kokoro-${{ runner.os }}-

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          ffmpeg -version | head -n 1
          espeak-ng --version

      - name: Install CPU-only PyTorch and torchvision
        shell: bash
        run: |
          python -m pip install --upgrade --force-reinstall --no-deps \
            "torch==2.14.0" \
            "torchvision==0.29.0" \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Preflight checks
        shell: bash
        run: |
          python -m py_compile pipeline.py
          python - <<'PY'
          import os
          import torch
          print("torch:", torch.__version__)
          print("cuda available:", torch.cuda.is_available())
          assert not torch.cuda.is_available(), "Expected CPU-only PyTorch on GitHub runner"
          if os.environ.get("PIPELINE_MODE") != "local_image_test":
              import kokoro
              print("Kokoro import: OK")
          else:
              print("Kokoro import: skipped for local image test")
          PY

      - name: Run pipeline
        shell: bash
        run: |
          python pipeline.py --mode "$PIPELINE_MODE"

      - name: Persist resumable state
        if: always() && env.PIPELINE_MODE == 'full'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: persist pipeline state"
            git push
          fi

      - name: Upload run diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: motive-unknown-run-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            run_work/topic.json
            run_work/research.txt
            run_work/story.json
            run_work/seo.json
            run_work/manifest.json
            state/last_run.json
            state/current_run/*.json
            voice_test_onyx.wav
            run_work/visual_test/*.jpg
            run_work/local_image_test/*.jpg
            run_work/scenes/*.jpg
            run_work/output/thumbnail.jpg
