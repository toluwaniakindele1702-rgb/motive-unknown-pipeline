name: Relic Loop Daily Video
run-name: Relic Loop #${{ github.run_number }} — Run ID ${{ github.run_id }} — ${{ github.event_name }}

on:
  schedule:
    - cron: '23 2 * * *'
      timezone: 'Africa/Lagos'
  # Production push triggering is handled by force_production_dispatch.yml.
  # Keeping a push trigger here would create duplicate production runs and can
  # cancel the real run through concurrency controls.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose a test or production run'
        required: true
        default: full
        type: choice
        options:
          - full
          - v2_test
          - voice_test
          - visual_test
          - local_image_test

concurrency:
  group: relic-loop-production-${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'full' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_VIDEO_MODEL: gemini-omni-1.1-flash
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
      YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'public' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_IMAGE_MODEL: '@cf/black-forest-labs/flux-2-klein-4b'
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      PUTER_AUTH_TOKEN: ${{ secrets.PUTER_AUTH_TOKEN }}
      PUTER_IMAGE_MODEL: ${{ vars.PUTER_IMAGE_MODEL || 'black-forest-labs/flux-2-pro' }}
      IMAGE_PROVIDERS: 'cloudflare,local,puter,huggingface,replicate'
      KOKORO_VOICE: am_michael
      KOKORO_SPEED: '1.05'
      CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'Relic Loop' }}
      MAX_VISUAL_BEATS_PER_VIDEO: ${{ vars.MAX_VISUAL_BEATS_PER_VIDEO || '150' }}
      BACKGROUND_MUSIC_VOLUME: ${{ vars.BACKGROUND_MUSIC_VOLUME || '0.055' }}
      SHORTS_ENABLED: ${{ vars.SHORTS_ENABLED || '1' }}
      SHORTS_COUNT: ${{ vars.SHORTS_COUNT || '4' }}
      SHORTS_MIN_SECONDS: ${{ vars.SHORTS_MIN_SECONDS || '60' }}
      SHORTS_MAX_SECONDS: ${{ vars.SHORTS_MAX_SECONDS || '180' }}
      RELIC_LOOP_RESUME: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Announce run ID immediately
        shell: bash
        run: |
          echo "=============================================="
          echo "RELIC LOOP RUN STARTED"
          echo "RUN NUMBER: ${{ github.run_number }}"
          echo "RUN ID:     ${{ github.run_id }}"
          echo "MODE:       ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'full' }}"
          echo "EVENT:      ${{ github.event_name }}"
          echo "SHA:        ${{ github.sha }}"
          echo "RUN URL:    https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "=============================================="
          {
            echo "## Relic Loop run"
            echo "- **Run number:** ${{ github.run_number }}"
            echo "- **Run ID:** ${{ github.run_id }}"
            echo "- **Mode:** ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'full' }}"
            echo "- **Event:** ${{ github.event_name }}"
            echo "- **Run URL:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clear stale failed-run state
        shell: bash
        run: |
          rm -f \
            state/current_run/topic.json \
            state/current_run/research.txt \
            state/current_run/story.json \
            state/current_run/script.json \
            state/current_run/seo.json \
            state/current_run/upload.json \
            state/current_run/shorts.json
          mkdir -p state/current_run

      - name: Set run mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "PIPELINE_MODE=${{ inputs.mode }}" >> "$GITHUB_ENV"
          else
            echo "PIPELINE_MODE=full" >> "$GITHUB_ENV"
          fi

      - name: Write run identity
        shell: bash
        run: |
          mkdir -p state/current_run
          cat > state/current_run/github_run.json <<'JSON'
          {
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "workflow": "${{ github.workflow }}",
            "event": "${{ github.event_name }}",
            "mode": "${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'full' }}",
            "sha": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "started_at": "${{ github.run_started_at }}",
            "run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          JSON

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Cache Hugging Face / Kokoro model
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/kokoro
          key: relic-loop-models-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            relic-loop-models-${{ runner.os }}-

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
          ffmpeg -version | head -n 1
          espeak-ng --version

      - name: Install CPU-only PyTorch and torchvision
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-cache-dir --retries 5 --timeout 120 --prefer-binary \
            "torch==2.14.0" \
            "torchvision==0.29.0" \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --retries 8 --timeout 180 --prefer-binary --no-input -r requirements.txt

      - name: Install Puter image client
        if: env.PIPELINE_MODE != 'v2_test'
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm install --no-save --no-audit --no-fund --prefer-offline @heyputer/puter.js
          node --check puter_image_worker.mjs

      - name: Preflight checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile pipeline.py production_hardening.py runtime_script_repair.py local_image_worker.py sitecustomize.py run_pipeline.py veo_v2.py v2_test.py
          python - <<'PY'
          import os
          import torch
          import requests
          import soundfile
          from PIL import Image
          import groq
          from pipeline import package_quality_issues
          _issues = package_quality_issues(
              {"question": "Why does this work?", "topic": "preflight", "category": "general"},
              {"scenes": [{"narration": "A valid scene with enough words for the smoke test."}]},
              {"title": "Why Does This Work?", "description": "Smoke test", "tags": ["test"], "thumbnail_headline": "The Hidden Reason"},
          )
          print("Packaging gate smoke test: OK", _issues)
          print("IMAGE_PROVIDERS:", os.environ.get("IMAGE_PROVIDERS"))
          print("torch:", torch.__version__)
          print("cuda available:", torch.cuda.is_available())
          assert not torch.cuda.is_available(), "Expected CPU-only PyTorch on GitHub runner"
          if os.environ.get("PIPELINE_MODE") != "local_image_test":
              import kokoro
              print("Kokoro import: OK")
          print("Core dependency imports: OK")
          PY
          if [[ "$PIPELINE_MODE" != "v2_test" ]]; then
            test -n "$GROQ_API_KEY" || { echo "GROQ_API_KEY is missing"; exit 1; }
            test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
            test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
            test -n "$YOUTUBE_TOKEN_JSON" || { echo "YOUTUBE_TOKEN_JSON is missing"; exit 1; }
            test -n "$YOUTUBE_CLIENT_SECRET_JSON" || { echo "YOUTUBE_CLIENT_SECRET_JSON is missing"; exit 1; }
          fi

      - name: FFmpeg filter smoke test
        if: env.PIPELINE_MODE != 'v2_test'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pipeline import _make_emphasis_filter
          vf = _make_emphasis_filter([40.0, 45.0, 50.0])
          if not vf:
              raise SystemExit("Emphasis filter was unexpectedly empty")
          cmd = ["ffmpeg", "-hide_banner", "-loglevel", "error", "-f", "lavfi", "-i", "color=c=black:s=1280x720:r=30:d=2", "-vf", vf + ",format=yuv420p", "-frames:v", "1", "-f", "null", "-"]
          subprocess.run(cmd, check=True)
          print("FFmpeg emphasis filter smoke test: OK")
          PY

      - name: Run isolated RL V2 prototype
        if: env.PIPELINE_MODE == 'v2_test'
        shell: bash
        run: |
          set -o pipefail
          python v2_test.py 2>&1 | tee v2_test.log

      - name: Upload V2 test artifact
        if: always() && env.PIPELINE_MODE == 'v2_test'
        uses: actions/upload-artifact@v4
        with:
          name: relic-loop-v2-test-${{ github.run_number }}
          path: |
            run_work/v2_test/relic_loop_v2_room_memory_test.mp4
            run_work/v2_test/manifest.json
            v2_test.log
          if-no-files-found: warn
          retention-days: 7

      - name: Run production pipeline
        if: env.PIPELINE_MODE != 'v2_test'
        shell: bash
        run: |
          set -o pipefail
          python run_pipeline.py --mode "$PIPELINE_MODE" 2>&1 | tee pipeline.log

      - name: Mark run result
        if: always()
        shell: bash
        run: |
          mkdir -p state/current_run
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          p = "state/current_run/github_run.json"
          try:
              data = json.load(open(p))
          except Exception:
              data = {}
          data["finished_at"] = datetime.now(timezone.utc).isoformat()
          data["pipeline_log"] = "v2_test.log" if data.get("mode") == "v2_test" else "pipeline.log"
          with open(p, "w") as f:
              json.dump(data, f, indent=2)
          PY

      - name: Capture run report
        if: always()
        shell: bash
        run: |
          mkdir -p state/current_run
          if [[ -f v2_test.log ]]; then tail -n 120 v2_test.log >> "$GITHUB_STEP_SUMMARY" || true; fi
          if [[ -f pipeline.log ]]; then tail -n 120 pipeline.log >> "$GITHUB_STEP_SUMMARY" || true; fi

      - name: Persist resumable state safely
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/current_run
          if git diff --cached --quiet; then
            echo "No resumable state changes to commit."
            exit 0
          fi
          git commit -m "chore: persist Relic Loop run state" || exit 0
          for attempt in 1 2 3; do
            git fetch origin main || true
            git rebase origin/main || { git rebase --abort 2>/dev/null || true; exit 0; }
            git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          echo "State persistence could not update main; production result remains unaffected."
          exit 0
