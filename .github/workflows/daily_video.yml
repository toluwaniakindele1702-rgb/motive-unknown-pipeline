name: Motive Unknown Daily Video

on:
  schedule:
    # 02:17 Africa/Lagos every day. GitHub supports timezone-aware schedules.
    - cron: '17 2 * * *'
      timezone: 'Africa/Lagos'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose a test or production run'
        required: true
        default: full
        type: choice
        options:
          - full
          - voice_test

concurrency:
  group: motive-unknown-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
      YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'private' }}
      KOKORO_VOICE: ${{ vars.KOKORO_VOICE || 'am_onyx' }}
      KOKORO_SPEED: ${{ vars.KOKORO_SPEED || '0.96' }}
      CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'Motive Unknown' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set run mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "PIPELINE_MODE=${{ inputs.mode }}" >> "$GITHUB_ENV"
          else
            echo "PIPELINE_MODE=full" >> "$GITHUB_ENV"
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Cache Hugging Face / Kokoro model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: kokoro-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            kokoro-${{ runner.os }}-

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          ffmpeg -version | head -n 1
          espeak-ng --version

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        shell: bash
        run: |
         python pipeline.py --mode "$PIPELINE_MODE"
      - name: Commit topic history and checkpoints
        if: success() && env.PIPELINE_MODE == 'full'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/content_history.json state/last_run.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update history after automated video"
            git push
          fi

      - name: Upload run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motive-unknown-run-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            run_work/topic.json
            run_work/research.txt
            run_work/story.json
            run_work/script.json
            run_work/seo.json
            run_work/manifest.json
            run_work/output/thumbnail.jpg
            voice_test_onyx.wav
            state/last_run.json
