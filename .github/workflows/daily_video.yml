name: Relic Loop Daily Video
run-name: Relic Loop #${{ github.run_number }} — Run ID ${{ github.run_id }} — ${{ github.event_name }}

on:
  schedule:
    - cron: '23 2 * * *'
      timezone: 'Africa/Lagos'
  push:
    paths:
      - '.github/force_production_run'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose a test or production run'
        required: true
        default: full
        type: choice
        options:
          - full
          - voice_test
          - visual_test
          - local_image_test

concurrency:
  group: ${{ github.workflow }}-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
      YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'public' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      PUTER_AUTH_TOKEN: ${{ secrets.PUTER_AUTH_TOKEN }}
      PUTER_IMAGE_MODEL: ${{ vars.PUTER_IMAGE_MODEL || 'black-forest-labs/flux-2-pro' }}
      IMAGE_PROVIDERS: 'cloudflare,local,puter,huggingface,replicate'
      KOKORO_VOICE: am_michael
      KOKORO_SPEED: '1.05'
      CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'Relic Loop' }}
      MAX_VISUAL_BEATS_PER_VIDEO: ${{ vars.MAX_VISUAL_BEATS_PER_VIDEO || '110' }}
      BACKGROUND_MUSIC_VOLUME: ${{ vars.BACKGROUND_MUSIC_VOLUME || '0.055' }}
      SHORTS_ENABLED: ${{ vars.SHORTS_ENABLED || '1' }}
      SHORTS_COUNT: ${{ vars.SHORTS_COUNT || '4' }}
      SHORTS_MIN_SECONDS: ${{ vars.SHORTS_MIN_SECONDS || '60' }}
      SHORTS_MAX_SECONDS: ${{ vars.SHORTS_MAX_SECONDS || '180' }}
      RELIC_LOOP_RESUME: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Announce run ID immediately
        shell: bash
        run: |
          echo "=============================================="
          echo "RELIC LOOP PRODUCTION RUN STARTED"
          echo "RUN NUMBER: ${{ github.run_number }}"
          echo "RUN ID:     ${{ github.run_id }}"
          echo "EVENT:      ${{ github.event_name }}"
          echo "SHA:        ${{ github.sha }}"
          echo "RUN URL:    https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "=============================================="
          {
            echo "## Relic Loop production run"
            echo "- **Run number:** ${{ github.run_number }}"
            echo "- **Run ID:** ${{ github.run_id }}"
            echo "- **Event:** ${{ github.event_name }}"
            echo "- **Run URL:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clear stale failed-run topic state
        shell: bash
        run: |
          rm -f \
            state/current_run/topic.json \
            state/current_run/research.txt \
            state/current_run/story.json \
            state/current_run/script.json \
            state/current_run/seo.json \
            state/current_run/upload.json \
            state/current_run/shorts.json
          mkdir -p state/current_run

      - name: Inject next scheduled Relic Loop topic
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          cat > state/current_run/topic.json <<'JSON'
          {
            "question": "Why does your voice sound different when you hear a recording?",
            "topic": "Why Your Recorded Voice Sounds Different",
            "category": "everyday psychology and human perception",
            "era": "modern day",
            "search_angles": [
              "why bone conduction makes your own voice sound different to you",
              "how air conduction changes the voice you hear from a recording",
              "what happens to the vocal tract and perceived pitch when speaking",
              "whether recordings actually make your voice deeper or higher or simply reveal the version others hear",
              "common myths about hearing your own voice"
            ]
          }
          JSON
          cp state/current_run/topic.json run_work/topic.json 2>/dev/null || true
          echo "[SCHEDULED TOPIC] Legacy file only; queue selector remains authoritative."

      - name: Set run mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "PIPELINE_MODE=${{ inputs.mode }}" >> "$GITHUB_ENV"
          else
            echo "PIPELINE_MODE=full" >> "$GITHUB_ENV"
          fi

      - name: Write run identity
        shell: bash
        run: |
          mkdir -p state/current_run
          cat > state/current_run/github_run.json <<'JSON'
          {
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "workflow": "${{ github.workflow }}",
            "event": "${{ github.event_name }}",
            "mode": "${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'full' }}",
            "sha": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "started_at": "${{ github.run_started_at }}",
            "run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          JSON

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Cache Hugging Face / Kokoro model
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/kokoro
          key: relic-loop-models-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            relic-loop-models-${{ runner.os }}-

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          ffmpeg -version | head -n 1
          espeak-ng --version

      - name: Install CPU-only PyTorch and torchvision
        shell: bash
        run: |
          python -m pip install --upgrade --force-reinstall --no-deps \
            "torch==2.14.0" \
            "torchvision==0.29.0" \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Puter image client
        shell: bash
        run: |
          node --version
          npm --version
          npm install --no-save @heyputer/puter.js
          node --check puter_image_worker.mjs

      - name: Preflight checks
        shell: bash
        run: |
          python -m py_compile pipeline.py local_image_worker.py sitecustomize.py run_pipeline.py
          python - <<'PY'
          import os
          import torch
          from pipeline import package_quality_issues
          _issues = package_quality_issues(
              {"question": "Why does this work?", "topic": "preflight", "category": "general"},
              {"scenes": [{"narration": "A valid scene with enough words for the smoke test."}]},
              {"title": "Why Does This Work?", "description": "Smoke test", "tags": ["test"], "thumbnail_headline": "The Hidden Reason"},
          )
          print("Packaging gate smoke test: OK", _issues)
          print("IMAGE_PROVIDERS:", os.environ.get("IMAGE_PROVIDERS"))
          print("torch:", torch.__version__)
          print("cuda available:", torch.cuda.is_available())
          assert not torch.cuda.is_available(), "Expected CPU-only PyTorch on GitHub runner"
          if os.environ.get("PIPELINE_MODE") != "local_image_test":
              import kokoro
              print("Kokoro import: OK")
          else:
              print("Kokoro import: skipped for local image test")
          PY

      - name: FFmpeg filter smoke test
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pipeline import _make_emphasis_filter
          vf = _make_emphasis_filter([40.0, 45.0, 50.0])
          if not vf:
              raise SystemExit("Emphasis filter was unexpectedly empty")
          cmd = ["ffmpeg", "-hide_banner", "-loglevel", "error", "-f", "lavfi", "-i", "color=c=black:s=1280x720:r=30:d=2", "-vf", vf + ",format=yuv420p", "-frames:v", "1", "-f", "null", "-"]
          subprocess.run(cmd, check=True)
          print("FFmpeg emphasis filter smoke test: OK")
          PY

      - name: Run pipeline
        shell: bash
        run: |
          set -o pipefail
          python run_pipeline.py --mode "$PIPELINE_MODE" 2>&1 | tee pipeline.log

      - name: Mark run result
        if: always()
        shell: bash
        run: |
          mkdir -p state/current_run
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          p = "state/current_run/github_run.json"
          try:
              data = json.load(open(p))
          except Exception:
              data = {}
          data["finished_at"] = datetime.now(timezone.utc).isoformat()
          data["pipeline_log"] = "pipeline.log"
          with open(p, "w") as f:
              json.dump(data, f, indent=2)
          PY

      - name: Capture run report
        if: always()
        shell: bash
        run: |
          mkdir -p state/current_run
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          identity_path = "state/current_run/github_run.json"
          report_path = "state/current_run/run_report.json"
          try:
              identity = json.load(open(identity_path))
          except Exception:
              identity = {}
          log_path = "pipeline.log"
          log_exists = os.path.exists(log_path)
          report = {
              "report_version": 1,
              "captured_at": datetime.now(timezone.utc).isoformat(),
              "status": os.environ.get("JOB_STATUS", "unknown"),
              "run_id": "${{ github.run_id }}",
              "run_number": "${{ github.run_number }}",
              "workflow": "${{ github.workflow }}",
              "event": "${{ github.event_name }}",
              "mode": "${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'full' }}",
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "pipeline_log": log_path if log_exists else None,
              "pipeline_log_size_bytes": os.path.getsize(log_path) if log_exists else 0,
              "identity": identity,
          }
          with open(report_path, "w") as f:
              json.dump(report, f, indent=2)
          print(json.dumps(report, indent=2))
          PY
        env:
          JOB_STATUS: ${{ job.status }}

      - name: Persist resumable state safely
        if: always() && env.PIPELINE_MODE == 'full'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist pipeline state"
          fi
          git pull --rebase origin main
          git push

      - name: Upload run diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relic-loop-run-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            pipeline.log
            state/current_run/github_run.json
            state/current_run/run_report.json
            run_work/topic.json
            run_work/research.txt
            run_work/story.json
            run_work/seo.json
            run_work/manifest.json
            state/last_run.json
            state/current_run/*.json
            state/provider_health.json
            run_work/visual_test/*.jpg
            run_work/local_image_test/*.jpg
            run_work/scenes/*.jpg
            run_work/output/thumbnail.jpg
            run_work/output/*.mp4
            run_work/output/*.srt
            run_work/output/*.wav
            run_work/audio/*.wav
            state/current_run/shorts.json
