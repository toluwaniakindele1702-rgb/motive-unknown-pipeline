name: Relic Loop Daily Video

on:
  schedule:
    - cron: '17 2 * * *'
      timezone: 'Africa/Lagos'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose a test or production run'
        required: true
        default: full
        type: choice
        options:
          - full
          - voice_test
          - visual_test
          - local_image_test

concurrency:
  group: ${{ github.workflow }}-production
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
      YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'public' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      IMAGE_PROVIDERS: ${{ vars.IMAGE_PROVIDERS || 'cloudflare,huggingface,replicate,local' }}
      KOKORO_VOICE: af_bella
      KOKORO_SPEED: '1.05'
      CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'Relic Loop' }}
      MAX_VISUAL_BEATS_PER_VIDEO: ${{ vars.MAX_VISUAL_BEATS_PER_VIDEO || '110' }}
      BACKGROUND_MUSIC_VOLUME: ${{ vars.BACKGROUND_MUSIC_VOLUME || '0.055' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set run mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "PIPELINE_MODE=${{ inputs.mode }}" >> "$GITHUB_ENV"
          else
            echo "PIPELINE_MODE=full" >> "$GITHUB_ENV"
          fi

      - name: Write run identity
        shell: bash
        run: |
          mkdir -p state/current_run
          cat > state/current_run/github_run.json <<'JSON'
          {
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "workflow": "${{ github.workflow }}",
            "event": "${{ github.event_name }}",
            "mode": "${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'full' }}",
            "sha": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "started_at": "${{ github.run_started_at }}",
            "run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          JSON

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Cache Hugging Face / Kokoro model
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/kokoro
          key: relic-loop-models-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            relic-loop-models-${{ runner.os }}-

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          ffmpeg -version | head -n 1
          espeak-ng --version

      - name: Install CPU-only PyTorch and torchvision
        shell: bash
        run: |
          python -m pip install --upgrade --force-reinstall --no-deps \
            "torch==2.14.0" \
            "torchvision==0.29.0" \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preflight checks
        shell: bash
        run: |
          python -m py_compile pipeline.py
          python - <<'PY'
          import os
          import torch
          print("torch:", torch.__version__)
          print("cuda available:", torch.cuda.is_available())
          assert not torch.cuda.is_available(), "Expected CPU-only PyTorch on GitHub runner"
          if os.environ.get("PIPELINE_MODE") != "local_image_test":
              import kokoro
              print("Kokoro import: OK")
          else:
              print("Kokoro import: skipped for local image test")
          PY

      - name: FFmpeg filter smoke test
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pipeline import _make_emphasis_filter
          vf = _make_emphasis_filter([40.0, 45.0, 50.0])
          if not vf:
              raise SystemExit("Emphasis filter was unexpectedly empty")
          print("Emphasis filter:", vf)
          cmd = [
              "ffmpeg", "-hide_banner", "-loglevel", "error", "-f", "lavfi",
              "-i", "color=c=black:s=1280x720:r=30:d=2", "-vf", vf + ",format=yuv420p",
              "-frames:v", "1", "-f", "null", "-"
          ]
          subprocess.run(cmd, check=True)
          print("FFmpeg emphasis filter smoke test: OK")
          PY

      - name: Run pipeline
        shell: bash
        run: |
          set -o pipefail
          python pipeline.py --mode "$PIPELINE_MODE" 2>&1 | tee pipeline.log

      - name: Mark run result
        if: always()
        shell: bash
        run: |
          mkdir -p state/current_run
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          p = "state/current_run/github_run.json"
          try:
              data = json.load(open(p))
          except Exception:
              data = {}
          data["finished_at"] = datetime.now(timezone.utc).isoformat()
          data["pipeline_log"] = "pipeline.log"
          with open(p, "w") as f:
              json.dump(data, f, indent=2)
          PY

      - name: Persist resumable state
        if: always() && env.PIPELINE_MODE == 'full'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: persist pipeline state"
            git push
          fi

      - name: Upload run diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relic-loop-run-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            pipeline.log
            state/current_run/github_run.json
            run_work/topic.json
            run_work/research.txt
            run_work/story.json
            run_work/seo.json
            run_work/manifest.json
            state/last_run.json
            state/current_run/*.json
            voice_test_current_male.wav
            voice_test_female_bella.wav
            voice_test_female_nicole.wav
            voice_test_onyx.wav
            run_work/visual_test/*.jpg
            run_work/local_image_test/*.jpg
            run_work/scenes/*.jpg
            run_work/output/thumbnail.jpg
