name: Relic Loop Image Shorts
run-name: "Relic Loop Image Short ${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional story seed; leave blank for an original absurd story"
        required: false
        default: ""
        type: string
  schedule:
    - cron: '23 14 * * *'
      timezone: 'Africa/Lagos'

concurrency:
  group: relic-loop-image-shorts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_WRITER_MODEL: ${{ vars.GROQ_WRITER_MODEL || 'openai/gpt-oss-120b' }}
      RELIC_LOOP_TOPIC: ${{ inputs.topic || vars.RELIC_LOOP_TOPIC || '' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_IMAGE_MODEL: '@cf/black-forest-labs/flux-2-klein-4b'
      RELIC_LOOP_IMAGE_WIDTH: '576'
      RELIC_LOOP_IMAGE_HEIGHT: '1024'