name: Relic Loop Image Shorts
run-name: "Relic Loop Image Short ${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional story seed; leave blank for an original story-first Short"
        required: false
        default: ""
        type: string
  schedule:
    # Temporary analytics test: 7:00 AM WAT instead of 10:00 AM.
    - cron: '0 7 * * *'
      timezone: 'Africa/Lagos'
    - cron: '0 13 * * *'
      timezone: 'Africa/Lagos'
    - cron: '0 16 * * *'
      timezone: 'Africa/Lagos'
    - cron: '0 19 * * *'
      timezone: 'Africa/Lagos'
    - cron: '30 21 * * *'
      timezone: 'Africa/Lagos'

concurrency:
  group: relic-loop-image-shorts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_WRITER_MODEL: 'openai/gpt-oss-120b'
      GROQ_REVIEWER_MODEL: 'openai/gpt-oss-120b'
      RELIC_LOOP_TOPIC: ${{ inputs.topic || vars.RELIC_LOOP_TOPIC || '' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_IMAGE_MODEL: '@cf/black-forest-labs/flux-2-dev'
      RELIC_LOOP_IMAGE_WIDTH: '576'
      RELIC_LOOP_IMAGE_HEIGHT: '1024'
      RELIC_LOOP_IMAGE_RETRIES: '3'
      RELIC_LOOP_OCR_RETRIES: '3'
      RELIC_LOOP_OCR_STRICT: '1'
      RELIC_LOOP_KOKORO_VOICE: 'am_liam'
      CHANNEL_NAME: 'Chispa-Pifia'
      YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'public' }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install production dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --retries 5 --timeout 120 --prefer-binary \
            'groq>=0.31,<1.0' \
            'requests>=2.32,<3' \
            'Pillow>=10,<13' \
            'kokoro>=0.9.4,<1.0' \
            'edge-tts>=7.0,<8' \
            'soundfile>=0.13,<1.0' \
            'numpy>=2.0,<3' \
            'google-api-python-client>=2.180,<3' \
            'google-auth>=2.40,<3' \
            'google-auth-httplib2>=0.2,<1' \
            'google-auth-oauthlib>=1.2,<2'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr espeak-ng

      - name: Verify approved visual references
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            assets/visual_references/Generate_modern_stickman_character_20261027121745.jpg \
            assets/visual_references/Remove_bag_and_animate_image_20261027125028.jpg; do
            test -s "$f" || { echo "::error::Missing approved visual reference: $f"; exit 1; }
            file "$f"
          done
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          paths = [
              Path('assets/visual_references/Generate_modern_stickman_character_20261027121745.jpg'),
              Path('assets/visual_references/Remove_bag_and_animate_image_20261027125028.jpg'),
          ]
          for path in paths:
              with Image.open(path) as im:
                  im.verify()
              with Image.open(path) as im:
                  print(f'Approved reference valid: {path.name}; format={im.format}; size={im.width}x{im.height}')
          PY

      - name: Preflight services and dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GROQ_API_KEY" || { echo "GROQ_API_KEY is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$YOUTUBE_TOKEN_JSON" || { echo "YOUTUBE_TOKEN_JSON is missing"; exit 1; }
          test -n "$YOUTUBE_CLIENT_SECRET_JSON" || { echo "YOUTUBE_CLIENT_SECRET_JSON is missing"; exit 1; }
          ffmpeg -version | head -n 1
          ffmpeg -filters | grep -q zoompan
          ffprobe -version | head -n 1
          tesseract --version | head -n 1
          espeak-ng --version | head -n 1
          python - <<'PY'
          import edge_tts, groq, requests
          from PIL import Image
          print('Python imports passed.')
          print('Writer model:', __import__('os').environ['GROQ_WRITER_MODEL'])
          print('Reviewer model:', __import__('os').environ['GROQ_REVIEWER_MODEL'])
          print('Image model:', __import__('os').environ['CLOUDFLARE_IMAGE_MODEL'])
          PY

      - name: Validate Python syntax before API generation
        run: |
          set -euo pipefail
          python -m py_compile \
            relic_loop_shorts_fixed.py \
            relic_loop_shorts_production.py \
            cloudflare_relic_loop_images.py \
            cloudflare_relic_loop_images_peanut.py \
            assemble_relic_loop_short.py \
            edge_tts.py \
            youtube_upload.py
          echo "Python syntax check passed."

      - name: Generate and quality-gate story
        run: |
          set -o pipefail
          python relic_loop_shorts_production.py 2>&1 | tee shorts_flow.log

      - name: Render story beats with FLUX.2 dev and approved references
        run: |
          set -o pipefail
          python cloudflare_relic_loop_images_peanut.py 2>&1 | tee cloudflare_images.log

      - name: Assemble with Liam narration as master timeline
        run: |
          set -o pipefail
          python assemble_relic_loop_short.py 2>&1 | tee assemble.log

      - name: Upload finished Short to Chispa-Pifia
        if: success()
        run: |
          set -o pipefail
          python youtube_upload.py 2>&1 | tee youtube_upload.log

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p run_diagnostics
          {
            echo "CHISPA-PIFIA PRODUCTION DIAGNOSTICS"
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "sha=${GITHUB_SHA}"
            echo "writer_model=${GROQ_WRITER_MODEL}"
            echo "reviewer_model=${GROQ_REVIEWER_MODEL}"
            echo "image_model=${CLOUDFLARE_IMAGE_MODEL}"
            echo "image_size=${RELIC_LOOP_IMAGE_WIDTH}x${RELIC_LOOP_IMAGE_HEIGHT}"
            echo "voice=${RELIC_LOOP_KOKORO_VOICE}"
            echo
            python --version 2>&1
            ffmpeg -version 2>&1 | head -n 2
            tesseract --version 2>&1 | head -n 2
          } > run_diagnostics/run_metadata.txt
          {
            echo "=== STORY ==="
            cat shorts_flow.log 2>/dev/null || true
            echo "=== IMAGES ==="
            cat cloudflare_images.log 2>/dev/null || true
            echo "=== ASSEMBLY ==="
            cat assemble.log 2>/dev/null || true
            echo "=== YOUTUBE ==="
            cat youtube_upload.log 2>/dev/null || true
          } > run_diagnostics/complete_logs.txt
          cp relic_loop_shorts_fixed.py run_diagnostics/ 2>/dev/null || true
          cp relic_loop_shorts_production.py run_diagnostics/ 2>/dev/null || true
          cp cloudflare_relic_loop_images_peanut.py run_diagnostics/ 2>/dev/null || true
          cp .github/workflows/relic_loop_image_shorts.yml run_diagnostics/ 2>/dev/null || true

      - name: Write run summary
        if: always()
        run: |
          {
            echo "# Chispa-Pifia Production"
            echo
            echo "Writer: ${GROQ_WRITER_MODEL}"
            echo "Reviewer: ${GROQ_REVIEWER_MODEL}"
            echo "Image model: ${CLOUDFLARE_IMAGE_MODEL}"
            echo "References: approved two-image Peanut-style visual bible"
            echo
            if [ -f state/current_run/flow_manifest.json ]; then cat state/current_run/flow_manifest.json; fi
            echo
            if [ -f state/current_run/cloudflare_image_manifest.json ]; then cat state/current_run/cloudflare_image_manifest.json; fi
            echo
            if [ -f state/current_run/timing_manifest.json ]; then cat state/current_run/timing_manifest.json; fi
            echo
            if [ -f state/current_run/youtube_upload.json ]; then cat state/current_run/youtube_upload.json; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload finished Short and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chispa-pifia-short-${{ github.run_number }}
          path: |
            state/current_run/relic_loop_short.json
            state/current_run/flow_storyboard_prompt.txt
            state/current_run/flow_manifest.json
            state/current_run/cloudflare_image_manifest.json
            state/current_run/timing_manifest.json
            state/current_run/youtube_upload.json
            state/current_run/relic_loop_short.mp4
            state/current_run/voiceover.wav
            state/current_run/voiceover_neural.mp3
            shorts_flow.log
            cloudflare_images.log
            assemble.log
            youtube_upload.log
            run_diagnostics/
          if-no-files-found: warn
          retention-days: 14
