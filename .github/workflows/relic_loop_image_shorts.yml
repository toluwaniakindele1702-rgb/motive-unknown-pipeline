name: Relic Loop Image Shorts
run-name: "Relic Loop Image Short ${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional story seed; leave blank for an original absurd story"
        required: false
        default: ""
        type: string
  schedule:
    - cron: '23 14 * * *'
      timezone: 'Africa/Lagos'

concurrency:
  group: relic-loop-image-shorts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_WRITER_MODEL: ${{ vars.GROQ_WRITER_MODEL || 'openai/gpt-oss-120b' }}
      RELIC_LOOP_TOPIC: ${{ inputs.topic || vars.RELIC_LOOP_TOPIC || '' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_IMAGE_MODEL: '@cf/black-forest-labs/flux-2-klein-4b'
      RELIC_LOOP_IMAGE_WIDTH: '576'
      RELIC_LOOP_IMAGE_HEIGHT: '1024'
      RELIC_LOOP_IMAGE_RETRIES: '3'
      RELIC_LOOP_OCR_RETRIES: '2'
      RELIC_LOOP_OCR_STRICT: '1'
      RELIC_LOOP_VOICE: 'en-US-AndrewNeural'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install lightweight dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --retries 5 --timeout 120 --prefer-binary groq requests pillow edge-tts
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr

      - name: Decode approved Relic Loop character reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run_work/references
          base64 -d assets/relic_loop_character_reference.jpg.b64 > run_work/references/relic_loop_character_reference.jpg
          test -s run_work/references/relic_loop_character_reference.jpg
          file run_work/references/relic_loop_character_reference.jpg

      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GROQ_API_KEY" || { echo "GROQ_API_KEY is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          ffmpeg -version | head -n 1
          ffmpeg -filters | grep -q zoompan || { echo "FFmpeg zoompan filter is missing"; exit 1; }
          tesseract --version | head -n 1
          python - <<'PY'
          import edge_tts
          print('edge-tts:', getattr(edge_tts, '__version__', 'installed'))
          PY

      - name: Validate Python files before spending API quota
        run: |
          set -euo pipefail
          python -m py_compile relic_loop_shorts_fixed.py cloudflare_relic_loop_images.py assemble_relic_loop_short.py
          echo "Python syntax check passed."

      - name: Generate story and paced storyboard
        run: |
          set -o pipefail
          python relic_loop_shorts_fixed.py 2>&1 | tee shorts_flow.log

      - name: Render every visual beat with Cloudflare
        run: |
          set -o pipefail
          python cloudflare_relic_loop_images.py 2>&1 | tee cloudflare_images.log

      - name: Assemble Short with robust camera motion and neural narration
        run: |
          set -o pipefail
          python assemble_relic_loop_short.py 2>&1 | tee assemble.log

      - name: Write run summary
        if: always()
        run: |
          {
            echo "## Relic Loop Image Short"
            echo
            echo "Paced 12-16-shot absurd story, approved hand-drawn stickman reference, probable-text OCR rejection with regeneration, push-in/pull-out camera motion with a static fallback, and natural neural narration."
            echo
            if [ -f state/current_run/flow_manifest.json ]; then cat state/current_run/flow_manifest.json; fi
            echo
            if [ -f state/current_run/cloudflare_image_manifest.json ]; then python - <<'PY'
          import json
          p='state/current_run/cloudflare_image_manifest.json'
          d=json.load(open(p))
          print('Rendered beats:', len(d.get('beats', [])))
          print('Model:', d.get('model'))
          print('Resolution:', d.get('width'), 'x', d.get('height'))
          print('Reference mode:', d.get('reference_mode'))
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload finished Short and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relic-loop-image-short-${{ github.run_number }}
          path: |
            state/current_run/relic_loop_short.json
            state/current_run/flow_storyboard_prompt.txt
            state/current_run/flow_manifest.json
            state/current_run/cloudflare_image_manifest.json
            state/current_run/relic_loop_short.mp4
            state/current_run/voiceover.wav
            state/current_run/voiceover_neural.mp3
            shorts_flow.log
            cloudflare_images.log
            assemble.log
          if-no-files-found: warn
          retention-days: 14
