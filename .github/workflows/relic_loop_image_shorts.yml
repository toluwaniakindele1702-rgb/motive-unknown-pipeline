name: Relic Loop Image Shorts
run-name: "Relic Loop Image Short ${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional story seed; leave blank for an original story-first mini-mystery, suspense, dilemma or twist"
        required: false
        default: ""
        type: string
  schedule:
    - cron: '0 19 * * *'
      timezone: 'Africa/Lagos'
    - cron: '0 1 * * *'
      timezone: 'Africa/Lagos'

concurrency:
  group: relic-loop-image-shorts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_WRITER_MODEL: ${{ vars.GROQ_WRITER_MODEL || 'openai/gpt-oss-120b' }}
      RELIC_LOOP_TOPIC: ${{ inputs.topic || vars.RELIC_LOOP_TOPIC || '' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_IMAGE_MODEL: '@cf/black-forest-labs/flux-2-klein-4b'
      RELIC_LOOP_IMAGE_WIDTH: '576'
      RELIC_LOOP_IMAGE_HEIGHT: '1024'
      RELIC_LOOP_IMAGE_RETRIES: '3'
      RELIC_LOOP_OCR_RETRIES: '2'
      RELIC_LOOP_OCR_STRICT: '1'
      RELIC_LOOP_VOICE: 'am_liam'
      RELIC_LOOP_KOKORO_VOICE: 'am_liam'
      CHANNEL_NAME: 'Chispa-Pifia'
      YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'private' }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Kokoro and pipeline dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --retries 5 --timeout 120 --prefer-binary \
            'groq>=0.31,<1.0' \
            'requests>=2.32,<3' \
            'Pillow>=10,<13' \
            'kokoro>=0.9.4,<1.0' \
            'soundfile>=0.13,<1.0' \
            'numpy>=2.0,<3' \
            'google-api-python-client>=2.180,<3' \
            'google-auth>=2.40,<3' \
            'google-auth-httplib2>=0.2,<1' \
            'google-auth-oauthlib>=1.2,<2'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr espeak-ng
      - name: Verify canonical Chispa-Pifia visual references
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/visual_references/file_00000000078881f486600a6d2d8ccc89.png || { echo "::error::Missing assets/visual_references/file_00000000078881f486600a6d2d8ccc89.png. Upload the uploaded character reference image before generating videos."; exit 1; }
          test -s assets/visual_references/file_000000008bfc81f480840c507c90542b.png || { echo "::error::Missing assets/visual_references/file_000000008bfc81f480840c507c90542b.png. Upload the uploaded environment/style reference image before generating videos."; exit 1; }
          file assets/visual_references/file_00000000078881f486600a6d2d8ccc89.png
          file assets/visual_references/file_000000008bfc81f480840c507c90542b.png
      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GROQ_API_KEY" || { echo "GROQ_API_KEY is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$YOUTUBE_TOKEN_JSON" || { echo "YOUTUBE_TOKEN_JSON is missing"; exit 1; }
          test -n "$YOUTUBE_CLIENT_SECRET_JSON" || { echo "YOUTUBE_CLIENT_SECRET_JSON is missing"; exit 1; }
          ffmpeg -version | head -n 1
          ffmpeg -filters | grep -q zoompan || { echo "FFmpeg zoompan filter is missing"; exit 1; }
          ffprobe -version | head -n 1
          tesseract --version | head -n 1
          espeak-ng --version | head -n 1
          python - <<'PY'
          import edge_tts
          import groq
          import requests
          from PIL import Image
          print('Pipeline Python imports passed: edge_tts, groq, requests, Pillow')
          print('Kokoro compatibility voice backend:', getattr(edge_tts, '__version__', 'installed'))
          print('Voice:', __import__('os').environ.get('RELIC_LOOP_KOKORO_VOICE'))
          PY
          python - <<'PY'
          import asyncio
          import os
          import tempfile
          from pathlib import Path
          import edge_tts
          out = Path(tempfile.gettempdir()) / 'relic_loop_kokoro_preflight.mp3'
          out.unlink(missing_ok=True)
          voice = os.environ.get('RELIC_LOOP_KOKORO_VOICE', 'am_liam')
          asyncio.run(edge_tts.Communicate('This is a Kokoro Liam preflight test.', voice=voice).save(str(out)))
          if not out.exists() or out.stat().st_size < 1000:
              raise SystemExit('Kokoro Liam preflight produced no usable audio')
          print('Kokoro Liam preflight passed:', out.stat().st_size, 'bytes')
          PY
          python - <<'PY'
          import json, os
          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          token = json.loads(os.environ['YOUTUBE_TOKEN_JSON'])
          client = json.loads(os.environ['YOUTUBE_CLIENT_SECRET_JSON'])
          if not isinstance(token, dict) or not isinstance(client, dict):
              raise SystemExit('YouTube OAuth secrets must contain JSON objects')
          creds = Credentials.from_authorized_user_info(token, scopes=['https://www.googleapis.com/auth/youtube.upload'])
          if not creds.valid:
              if creds.expired and creds.refresh_token:
                  creds.refresh(Request())
              else:
                  raise SystemExit('Stored YouTube OAuth credentials are invalid and cannot be refreshed')
          print('YouTube OAuth preflight passed.')
          PY
      - name: Validate Python files before spending API quota
        run: |
          set -euo pipefail
          python -m py_compile relic_loop_shorts_fixed.py cloudflare_relic_loop_images.py assemble_relic_loop_short.py edge_tts.py youtube_upload.py
          echo "Python syntax check passed."
      - name: Generate story and story-driven storyboard
        run: |
          set -o pipefail
          python relic_loop_shorts_fixed.py 2>&1 | tee shorts_flow.log
      - name: Render every meaningful visual beat with Cloudflare
        run: |
          set -o pipefail
          python cloudflare_relic_loop_images.py 2>&1 | tee cloudflare_images.log
      - name: Assemble with Liam narration as the master timeline
        run: |
          set -o pipefail
          python assemble_relic_loop_short.py 2>&1 | tee assemble.log
      - name: Upload finished Short to Chispa-Pifia
        if: success()
        run: |
          set -o pipefail
          python youtube_upload.py 2>&1 | tee youtube_upload.log
      - name: Collect complete run diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p run_diagnostics
          {
            echo "RELlC LOOP RUN DIAGNOSTICS"
            echo "==========================="
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "ref=${GITHUB_REF}"
            echo "sha=${GITHUB_SHA}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "actor=${GITHUB_ACTOR}"
            echo "server_url=${GITHUB_SERVER_URL}"
            echo "topic=${RELIC_LOOP_TOPIC}"
            echo "writer_model=${GROQ_WRITER_MODEL}"
            echo "image_model=${CLOUDFLARE_IMAGE_MODEL}"
            echo "image_size=${RELIC_LOOP_IMAGE_WIDTH}x${RELIC_LOOP_IMAGE_HEIGHT}"
            echo "voice=${RELIC_LOOP_VOICE}"
            echo "kokoro_voice=${RELIC_LOOP_KOKORO_VOICE}"
            echo "youtube_channel=${CHANNEL_NAME}"
            echo "youtube_privacy=${YOUTUBE_PRIVACY_STATUS}"
            echo
            echo "git_commit=$(git rev-parse HEAD 2>/dev/null)"
            echo "git_branch=$(git branch --show-current 2>/dev/null)"
            echo
            echo "PYTHON:"
            python --version 2>&1
            echo
            echo "INSTALLED PYTHON PACKAGES:"
            python -m pip freeze 2>&1
            echo
            echo "SYSTEM:"
            uname -a 2>&1
            echo
            echo "FFMPEG:"
            ffmpeg -version 2>&1 | head -n 2
            echo
            echo "TESSERACT:"
            tesseract --version 2>&1 | head -n 2
            echo
            echo "DIRECTORY SNAPSHOT:"
            find state/current_run -maxdepth 2 -type f -printf '%p %s bytes\n' 2>/dev/null | sort
          } > run_diagnostics/run_metadata.txt
          {
            echo "=== STORY GENERATION LOG ==="
            cat shorts_flow.log 2>/dev/null || echo "shorts_flow.log was not created"
            echo
            echo "=== CLOUDFLARE IMAGE LOG ==="
            cat cloudflare_images.log 2>/dev/null || echo "cloudflare_images.log was not created"
            echo
            echo "=== ASSEMBLY LOG ==="
            cat assemble.log 2>/dev/null || echo "assemble.log was not created"
            echo
            echo "=== YOUTUBE UPLOAD LOG ==="
            cat youtube_upload.log 2>/dev/null || echo "youtube_upload.log was not created"
          } > run_diagnostics/complete_logs.txt
          {
            echo "=== AVAILABLE RUN OUTPUTS ==="
            for f in \
              state/current_run/relic_loop_short.json \
              state/current_run/flow_storyboard_prompt.txt \
              state/current_run/flow_manifest.json \
              state/current_run/cloudflare_image_manifest.json \
              state/current_run/timing_manifest.json \
              state/current_run/youtube_upload.json; do
              if [ -f "$f" ]; then
                echo
                echo "--- $f ---"
                cat "$f"
              else
                echo
                echo "--- $f: NOT CREATED ---"
              fi
            done
          } > run_diagnostics/run_outputs.txt
          cp relic_loop_shorts_fixed.py run_diagnostics/relic_loop_shorts_fixed.py 2>/dev/null || true
          cp cloudflare_relic_loop_images.py run_diagnostics/cloudflare_relic_loop_images.py 2>/dev/null || true
          cp assemble_relic_loop_short.py run_diagnostics/assemble_relic_loop_short.py 2>/dev/null || true
          cp edge_tts.py run_diagnostics/edge_tts.py 2>/dev/null || true
          cp youtube_upload.py run_diagnostics/youtube_upload.py 2>/dev/null || true
          cp .github/workflows/relic_loop_image_shorts.yml run_diagnostics/relic_loop_image_shorts.yml 2>/dev/null || true
          echo "Diagnostics bundle created."
      - name: Write run summary
        if: always()
        run: |
          {
            echo "# Chispa-Pifia Image Short"
            echo
            echo "## RUN IDENTIFIERS"
            echo "- **GitHub Run Number:** ${GITHUB_RUN_NUMBER}"
            echo "- **GitHub Internal Run ID:** ${GITHUB_RUN_ID}"
            echo "- **Run Attempt:** ${GITHUB_RUN_ATTEMPT}"
            echo "- **Workflow:** ${GITHUB_WORKFLOW}"
            echo "- **Event:** ${GITHUB_EVENT_NAME}"
            echo "- **Commit SHA:** ${GITHUB_SHA}"
            echo "- **Repository:** ${GITHUB_REPOSITORY}"
            echo "- **Run URL:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "Story-first Short: mini-mystery/suspense/dilemma/problem-solving/fair twist; narration first, 10-14 meaningful literal visual beats, Kokoro Liam voice as master timeline, strict OCR text rejection, no fixed image cadence."
            echo
            if [ -f state/current_run/flow_manifest.json ]; then cat state/current_run/flow_manifest.json; fi
            echo
            if [ -f state/current_run/cloudflare_image_manifest.json ]; then python - <<'PY'
          import json
          p='state/current_run/cloudflare_image_manifest.json'
          d=json.load(open(p))
          print('Rendered beats:', len(d.get('beats', [])))
          print('Model:', d.get('model'))
          print('Resolution:', d.get('width'), 'x', d.get('height'))
          print('Reference mode:', d.get('reference_mode'))
          PY
            fi
            echo
            if [ -f state/current_run/timing_manifest.json ]; then cat state/current_run/timing_manifest.json; fi
            echo
            if [ -f state/current_run/youtube_upload.json ]; then cat state/current_run/youtube_upload.json; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload finished Short and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relic-loop-image-short-${{ github.run_number }}
          path: |
            state/current_run/relic_loop_short.json
            state/current_run/flow_storyboard_prompt.txt
            state/current_run/flow_manifest.json
            state/current_run/cloudflare_image_manifest.json
            state/current_run/timing_manifest.json
            state/current_run/youtube_upload.json
            state/current_run/relic_loop_short.mp4
            state/current_run/voiceover.wav
            state/current_run/voiceover_neural.mp3
            shorts_flow.log
            cloudflare_images.log
            assemble.log
            youtube_upload.log
            run_diagnostics/
          if-no-files-found: warn
          retention-days: 14
