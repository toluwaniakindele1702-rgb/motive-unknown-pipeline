name: Relic Loop Repair Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "*.py"
      - ".github/scripts/relic_loop_self_heal.py"
      - ".github/workflows/relic_loop_repair_validation.yml"

permissions:
  contents: read

concurrency:
  group: relic-loop-repair-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-repair:
    if: startsWith(github.head_ref, 'auto-repair/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout proposed repair
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install repair-agent test dependency
        run: python -m pip install --disable-pip-version-check 'groq>=0.31,<1'

      - name: Validate patch guard
        run: python .github/scripts/relic_loop_self_heal.py --self-test

      - name: Compile changed Python files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          mapfile -t FILES < <(git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD" -- '*.py')
          if [ "${#FILES[@]}" -gt 0 ]; then
            python -m py_compile "${FILES[@]}"
          fi

      - name: Run story engine deterministic self-test when changed
        run: |
          if git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD" | grep -Fxq 'chispa_pifia_v2.py'; then
            python chispa_pifia_v2.py --self-test
          fi
