name: Relic Loop Kokoro Voice Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kokoro
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          python -m pip install --disable-pip-version-check "kokoro>=0.9.4" soundfile

      - name: Generate Kokoro samples
        run: python relic_loop_voice_test.py

      - name: Upload Kokoro samples
        uses: actions/upload-artifact@v4
        with:
          name: relic-loop-kokoro-voice-test
          path: voice_samples/
          retention-days: 14
