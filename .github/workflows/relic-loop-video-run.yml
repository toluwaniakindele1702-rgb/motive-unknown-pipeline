name: Relic Loop independent video production

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional story topic (leave blank for a fresh premise)"
        required: false
        type: string
        default: ""
  schedule:
    - cron: "0 17 * * *"
  push:
    branches: [feature/relic-loop-new-pipeline]
    paths:
      - ".github/triggers/relic-loop-video-run.txt"

permissions:
  contents: read
  actions: write

jobs:
  produce-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/relic-loop-new-pipeline
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system media tools
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          else
            ffmpeg -version | head -n 1
          fi
      - name: Install independent pipeline dependencies
        env:
          RAPHAEL_STORAGE_STATE_JSON: ${{ secrets.RAPHAEL_STORAGE_STATE_JSON }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'groq>=0.31,<1' 'requests>=2.32,<3' 'Pillow>=11,<13' 'edge-tts>=7,<8'
          if [ -n "$RAPHAEL_STORAGE_STATE_JSON" ]; then
            python -m pip install 'playwright>=1.50,<2'
            python -m playwright install chromium --with-deps
          else
            echo "Raphael session absent; skipping browser installation and using Cloudflare image fallback."
          fi
      - name: Check required credentials (without printing values)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$GROQ_API_KEY" || { echo "::error::GROQ_API_KEY repository secret is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID repository secret is missing"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN repository secret is missing"; exit 1; }
      - name: Restore previous Quality AI feedback
        uses: actions/cache@v4
        with:
          path: relic_loop_output/latest_quality_feedback.json
          key: relic-loop-feedback-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            relic-loop-feedback-${{ github.ref_name }}-
      - name: Produce video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAPHAEL_STORAGE_STATE_JSON: ${{ secrets.RAPHAEL_STORAGE_STATE_JSON }}
          QUALITY_AI_MODEL: ${{ vars.QUALITY_AI_MODEL || 'openai/gpt-oss-120b' }}
          CREATIVE_AI_MODEL: ${{ vars.CREATIVE_AI_MODEL || 'openai/gpt-oss-120b' }}
          RELIC_LOOP_USE_RAPHAEL: "1"
          RELIC_LOOP_OUTPUT_DIR: "relic_loop_output"
        run: |
          python relic_loop_video.py --topic "${{ inputs.topic }}"
      - name: Publish finished Short publicly
        id: publish
        if: success()
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: |
          VIDEO=$(find relic_loop_output -name relic_loop_video.mp4 -type f | sort | tail -n 1)
          REPORT=$(find relic_loop_output -name run_report.json -type f | sort | tail -n 1)
          test -n "$VIDEO" || { echo "::error::No finished MP4 found"; exit 1; }
          test -n "$REPORT" || { echo "::error::No run report found"; exit 1; }
          python -m pip install "google-api-python-client>=2.130,<3" "google-auth>=2.30,<3"
          RELIC_LOOP_VIDEO_PATH="$VIDEO" RELIC_LOOP_REPORT_PATH="$REPORT" python relic_loop_youtube_publish.py
      - name: Deactivate legacy production workflow after public upload succeeds
        if: success() && steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable chispa_pifia_v2.yml --repo "$GITHUB_REPOSITORY"
      - name: Upload generated video and run report as downloadable artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relic-loop-video-${{ github.run_number }}
          path: |
            relic_loop_output/**
          if-no-files-found: warn
          retention-days: 14
